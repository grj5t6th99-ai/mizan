/* ---------- end of service ----------
   What is owed when someone leaves, set against what has been
   provided for. */
function settlementForm(){
  const staff=DB.employees.filter(e=>e.active);
  formDoc({title:"End of service settlement",wide:true,saveLabel:"Post the settlement",
    fields:v=>{
      const e=DB.employees.find(x=>x.id===v.employee)||staff[0]||{};
      return [
        {n:"employee",label:"Employee",type:"select",options:staff.map(x=>({v:x.id,l:x.name})),
         value:(staff[0]||{}).id},
        {n:"leftOn",label:"Last working day",type:"date",value:today()},
        {n:"reason",label:"Reason",type:"select",
         options:["Resignation","End of contract","Termination by employer","Retirement"],
         value:"End of contract"},
        {n:"leaveDays",label:"Untaken leave days",type:"number",step:"0.5",value:0},
        {n:"noticeDays",label:"Notice paid in lieu (days)",type:"number",step:"1",value:0},
        {n:"ticket",label:"Repatriation ticket (QR)",type:"number",value:e.ticket||1800},
        {n:"cash",label:"Paid from",type:"select",options:cashOptions(),value:tagCode("bank")}
      ];
    },
    journal:v=>{
      const e=DB.employees.find(x=>x.id===v.employee); if(!e) return [];
      const s=settlementFigures(e,v);
      if(s.net<=0&&s.gross<=0) return [];
      const L=[];
      /* draw down the provisions first, and only charge the shortfall */
      if(s.gratuityFromProvision) L.push({account:"2210",dr:s.gratuityFromProvision,cr:0,party:e.id,memo:"Gratuity provided"});
      if(s.gratuityShortfall) L.push({account:"6105",dr:s.gratuityShortfall,cr:0,memo:"Gratuity not provided"});
      if(s.leaveFromProvision) L.push({account:"2126",dr:s.leaveFromProvision,cr:0,party:e.id,memo:"Leave provided"});
      if(s.leaveShortfall) L.push({account:"6125",dr:s.leaveShortfall,cr:0,memo:"Leave not provided"});
      if(s.ticketFromProvision) L.push({account:"2127",dr:s.ticketFromProvision,cr:0,party:e.id,memo:"Ticket provided"});
      if(s.ticketShortfall) L.push({account:"6125",dr:s.ticketShortfall,cr:0,memo:"Ticket not provided"});
      if(s.notice) L.push({account:"6100",dr:s.notice,cr:0,memo:"Notice in lieu"});
      if(s.advance) L.push({account:"1155",dr:0,cr:s.advance,party:e.id,memo:"Advance recovered"});
      L.push({account:v.cash,dr:0,cr:s.net,party:null,memo:"Final settlement — "+e.name});
      return L;
    },
    note:v=>{
      const e=DB.employees.find(x=>x.id===v.employee); if(!e) return "";
      const s=settlementFigures(e,v);
      const row=(l,x)=>'<tr><td>'+esc(l)+'</td><td class="num">'+money(x)+'</td></tr>';
      return '<table style="width:100%">'+
        row(t("Service"),svcYears(e))+
        row(t("Gratuity")+" ("+DB.settings.gratuityDays+" "+t("days")+"/"+t("year")+")",s.gratuity)+
        row(t("Leave encashment")+" ("+(+v.leaveDays||0)+" "+t("days")+")",s.leave)+
        (s.notice?row(t("Notice in lieu"),s.notice):"")+
        row(t("Repatriation ticket"),s.ticket)+
        (s.advance?row(t("Less advance"),-s.advance):"")+
        '<tr style="font-weight:700;border-top:1px solid var(--ink)"><td>'+esc(t("Net payable"))+
        '</td><td class="num">'+money(s.net)+'</td></tr></table>'+
        (s.gratuityShortfall||s.leaveShortfall
          ? '<span style="color:var(--amber)">'+esc(isAR()
              ?"المخصص لا يغطي المستحق بالكامل؛ الفرق يُحمَّل على مصروف الفترة."
              :"The provision does not cover the full entitlement. The shortfall is charged to this period.")+'</span>'
          : '<span style="color:var(--ink-soft)">'+esc(isAR()
              ?"المخصص يغطي المستحق بالكامل — وهذا هو الغرض من تكوينه شهرياً."
              :"The provision covers it in full, which is what accruing monthly is for.")+'</span>');
    },
    save:v=>{
      guardPost();
      const e=DB.employees.find(x=>x.id===v.employee);
      const s=settlementFigures(e,v);
      Ledger.post({no:nextNo("PV"),date:v.leftOn,source:"Payment",
        memo:"End of service settlement — "+e.name+" ("+v.reason+")",lines:formDocJournal.lines,
        doc:{no:"",from:v.cash}});
      e.active=false; e.left=v.leftOn;
      commit("Settlement posted for "+e.name);
    }});
}

function settlementFigures(e,v){
  const years=Math.max(svcYears(e),0);
  const daily=R2((+e.basic||0)/DAYS_PER_MONTH);
  /* Labour Law Art. 54: gratuity is due after one completed year */
  const gratuity = years>=1 ? R2(daily*DB.settings.gratuityDays*years) : 0;
  const leave = R2(daily*(+v.leaveDays||0));
  const notice = R2(daily*(+v.noticeDays||0));
  const ticket = R2(v.ticket);
  const provGratuity=R2(-Ledger.bal("2210",{party:e.id}));
  const provLeave=R2(-Ledger.bal("2126",{party:e.id}));
  const provTicket=R2(-Ledger.bal("2127",{party:e.id}));
  const advance=Math.max(Ledger.bal("1155",{party:e.id}),0);
  const take=(due,prov)=>({from:Math.min(due,prov),short:Math.max(R2(due-prov),0)});
  const g=take(gratuity,provGratuity), l=take(leave,provLeave), tk=take(ticket,provTicket);
  const gross=R2(gratuity+leave+notice+ticket);
  return {gratuity,leave,notice,ticket,advance,gross,net:R2(gross-advance),
    gratuityFromProvision:g.from,gratuityShortfall:g.short,
    leaveFromProvision:l.from,leaveShortfall:l.short,
    ticketFromProvision:tk.from,ticketShortfall:tk.short};
}

function repLabour(){

  DB.projects.forEach(p=>{

    cc.forEach(c=>{

        .filter(l=>l.costCode===c.id).reduce((x,l)=>x+(+l.normal||0)+(+l.ot||0),0)),0));
      const cost=ccActual(c).by.labour;

      .map((x,i)=>'<th'+(i>2?' class="num"':'')+'>'+esc(t(x))+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(r=>{

      money(r.cost)+'</td><td class="num">'+money(r.rate)+'</td><td class="num">'+money(r.budget)+

    ?"تُرحَّل أجور موظفي المشاريع أولاً إلى حساب وسيط، ثم توزعها الجداول الزمنية على بنود التكلفة. ما يتبقى في الحساب الوسيط هو وقت لم يُحمَّل على أي عمل."
    :"Project wages are posted first to a holding account, and timesheets move them onto cost codes. What remains in the holding account is time nobody booked to a job.")+'</p>'));
  return sheet("Labour and Plant",tp("asAt",fmtDate(today())),node);

/* ============================================================
   MIZAN demo · 12 · site operations

   Four places money leaks after the work is finished.

   Retention: ten per cent of everything you have certified is
   sitting with the client, half of it released at completion and
   half a year later. Nobody chases it because nobody has a list.

   Back-charges: plant, materials and attendance you provided to a
   subcontractor and never deducted from his certificate.

   Materials: what left the store against what the measured work
   should have used. The difference is waste, breakage or theft.

   Day-works: work done on instruction, signed by the consultant,
   and then never billed because the sheet went in a drawer.
   ============================================================ */

const DLP_MONTHS_DEFAULT = 12;
const BACKCHARGE_TYPES=[["PLANT","Plant and equipment provided","معدات مقدَّمة"],
  ["MATERIAL","Materials supplied","مواد موردة"],["ATTENDANCE","Attendance and facilities","خدمات ومرافق"],
  ["REMEDIAL","Remedial and making good","إصلاح أعمال معيبة"],["OTHER","Other","أخرى"]];
const DAYWORK_TYPES=[["LABOUR","Labour","عمالة"],["PLANT","Plant","معدات"],["MATERIAL","Material","مواد"]];

const backcharges = () => DB.backcharges||[];
const issues      = () => DB.issues||[];
const dayworks    = () => DB.dayworks||[];

/* addMonths already exists in the engine; reusing it rather than
   declaring a second one. */

/* ---------- retention ---------- */
function retentionPosition(p){
  const held=R2(Ledger.show(tagCode("retention_rec"),{project:p.id}));
  const pc=p.pcDate||"";
  const dlp=p.dlpMonths||DLP_MONTHS_DEFAULT;
  const firstDue = pc || "";
  const secondDue = pc ? addMonths(pc,dlp) : "";
  const released=R2((p.retentionReleased||0));
  const half=R2((held+released)/2);
  return {held,released,pc,dlp,firstDue,secondDue,half,
    firstDueDays: firstDue? daysBetween(firstDue,today()) : null,
    secondDueDays: secondDue? daysBetween(secondDue,today()) : null};
}

  {party:pkg.party,project:pkg.project}));

  formDoc({title:"Release retention",wide:true,saveLabel:"Invoice the release",
    fields:()=>[
      {n:"pc",label:"Practical completion",type:"date",value:r.pc||today()},
      {n:"dlp",label:"Defects liability period (months)",type:"number",step:"1",value:r.dlp},
      {n:"moiety",label:"Release",type:"select",
       options:[{v:"half",l:isAR()?"النصف الأول عند الإنجاز":"First half, at completion"},
                {v:"all",l:isAR()?"كامل المتبقي":"All that remains"}],value:"half"},
      {n:"date",label:"Release date",type:"date",value:today()},
      {n:"amount",label:"Amount (QR)",type:"number",syncOn:"moiety",
       value:r.half}
    ],
    journal:v=>{
      const amt=R2(v.amount); if(amt<=0) return [];
      return [{account:tagCode("ar"),dr:amt,cr:0,party:p.customer,project:p.id,memo:"Retention released"},
              {account:tagCode("retention_rec"),dr:0,cr:amt,party:p.customer,project:p.id,memo:"Retention released"}];
    },
    note:v=>{
      const amt=R2(v.amount);
      const second=addMonths(v.pc,+v.dlp||12);
      let out=esc(t("Retention held by clients"))+": <b>"+qr(r.held)+"</b>"+
        "<br>"+esc(isAR()?"نهاية فترة الصيانة":"Defects period ends")+": "+fmtDate(second);
      if(amt>r.held) out+='<br><span style="color:var(--maroon)">'+esc(isAR()
        ?"المبلغ يتجاوز المحتجز.":"That is more than is being held.")+'</span>';
      out+="<br><span style='color:var(--ink-soft)'>"+esc(isAR()
        ?"الإفراج ينقل المبلغ من المحتجزات إلى الذمم المدينة؛ ثم يُحصَّل كأي فاتورة."
        :"Releasing moves the money from retention into receivables. It is then collected like any invoice.")+"</span>";
      return out;
    },
    save:v=>{
      guardPost();
      const amt=R2(v.amount);
      if(amt<=0) throw new Error("Enter an amount.");
      if(amt>r.held+0.004) throw new Error("That is more retention than is being held.");
      p.pcDate=v.pc; p.dlpMonths=+v.dlp||12;
      p.retentionReleased=R2((p.retentionReleased||0)+amt);
      const no=nextNo("SI");
      const cust=DB.customers.find(c=>c.id===p.customer)||{};
      Ledger.post({no,date:v.date,source:"Sales Invoice",project:p.id,
        memo:"Retention released — "+p.code,lines:formDocJournal.lines,
        doc:{no,date:v.date,due:addDays(v.date,cust.terms||30),party:p.customer,
          type:"Retention release",project:p.id,gross:amt,retention:0,receivable:amt,lines:[]}});
      commit("Retention released");
    }});
}

/* What the measured work should have consumed, against what
   actually left the store. The difference is waste, breakage or
   something that walked. */
function materialReconciliation(){
  const rows=[];
  DB.projects.forEach(p=>{
    const cc=costCodes(p.id); if(!cc.length) return;
    const wd=workDone(p);
    cc.forEach(c=>{
      const budget=R2(c.budget.material||0);
      if(!budget) return;
      const pct=wd.byCode[c.id]||0;
      const allowed=R2(budget*pct/100);
      const used=ccActual(c).by.material;
      if(!allowed&&!used) return;
      rows.push({project:p.code,code:c.code,desc:c.desc,budget,pct,allowed,used,
        variance:R2(allowed-used),
        pctVar: allowed? Math.round((used-allowed)/allowed*1000)/10 : null});
    });
  });
  const el=table([
    {h:"Project",r:r=>'<span class="code">'+esc(r.project)+'</span>'},
    {h:"Code",r:r=>'<span class="code">'+esc(r.code)+'</span>'},
    {h:"Description",r:r=>esc(r.desc)},
    {h:"Material budget",num:1,r:r=>money(r.budget)},
    {h:"% complete",num:1,r:r=>r.pct+"%"},
    {h:"Should have used",num:1,r:r=>money(r.allowed)},
    {h:"Actually issued",num:1,r:r=>money(r.used)},
    {h:"Variance",num:1,cls:r=>r.variance<0?"neg":"pos",r:r=>money(r.variance)},
    {h:"%",num:1,cls:r=>r.pctVar>5?"neg":"",r:r=>r.pctVar!=null?(r.pctVar>0?"+":"")+r.pctVar+"%":"—"}
  ],rows,{emptyTitle:"Nothing to reconcile",
    emptyBody:isAR()?"لا توجد مواد مُقاسة ومصروفة بعد.":"No measured work with materials issued against it yet."});
  return card("Material reconciliation — measured against issued",el);
}

/* A signed sheet becomes a variation, which is already wired to move
   the contract value, the budget and the programme together. */
function dwToVariation(x){
  const p=DB.projects.find(y=>y.id===x.project);
  confirmDo(isAR()
    ?"تحويل ورقة الأعمال اليومية "+x.ref+" إلى أمر تغيير بقيمة "+money(dwValue(x))+"؟"
    :"Turn day-work sheet "+x.ref+" into a variation worth "+money(dwValue(x))+"?",
    ()=>{
      if(!canPost()) return toast(t("Your role cannot post."));
      const vo={id:"VO"+Date.now(),ref:nextNo("VO"),project:x.project,
        title:"Day-works "+x.ref+(x.instruction?" — "+x.instruction:""),
        sell:dwValue(x),cost:dwCost(x),days:0,status:"Approved",date:today()};
      DB.variations=(DB.variations||[]).concat([vo]);
      DB.costCodes=(DB.costCodes||[]).concat([{id:"CC"+Date.now(),project:x.project,
        code:"DW-"+x.ref.split("-").pop(),section:"Day-works",desc:vo.title,unit:"SUM",qty:1,
        budget:{material:0,labour:0,plant:0,subcontract:0,other:dwCost(x)},sell:dwValue(x)}]);

      commit("Day-work billed as "+vo.ref);
    },isAR()?"تحويل":"Convert");
}

/* ============================================================
   MIZAN demo · 13 · treasury and reporting

   Three things a contractor is asked for and usually cannot
   produce quickly.

   The cash forecast, because contracting is a business that can be
   profitable and still run out of money: you pay wages weekly and
   get certified monthly, sixty days later.

   The work in progress schedule, because the auditor needs to know
   what has been earned against what has been billed, and the answer
   is almost never the same number.

   The bank reconciliation, because until it is done, the cash
   figure is an opinion.
   ============================================================ */

const cashAccounts = () => DB.accounts.filter(a=>a.tag==="cash"||a.tag==="bank");
const cashBalance  = () => R2(cashAccounts().reduce((s,a)=>s+Ledger.bal(a.code),0));
const monthKey = iso => String(iso).slice(0,7);
const monthLabel = key => {
  const d=dnum(key+"-01");
  return isAR() ? MONTHS_AR[d.getMonth()]+" "+d.getFullYear()
    : d.toLocaleDateString("en-GB",{month:"short",year:"numeric",timeZone:"UTC"});
};
const nextMonths = n => {
  const out=[]; let d=dnum(today()); d.setDate(1);
  for(let i=0;i<n;i++){ out.push(d.toISOString().slice(0,7)); d.setMonth(d.getMonth()+1); }
  return out;
};

/* ---------- cash flow forecast ---------- */
function cashForecast(months){
  const keys=nextMonths(months||6);
  const rows={};
  const add=(bucket,key,amt)=>{ if(!keys.includes(key)) return;
    rows[bucket]=rows[bucket]||{}; rows[bucket][key]=R2((rows[bucket][key]||0)+amt); };

  /* money in: invoices already raised and waiting */
  /* overdue invoices land in the first month; they are late, not gone */
  openDocs("SI").filter(d=>d.open>0.005).forEach(d=>{
    const k=keys.includes(monthKey(d.due))?monthKey(d.due):(d.due<today()?keys[0]:null);
    if(k) add("Customer receipts",k,d.open);
  });

  /* Retention becoming claimable. Anything already past its date is
     put in the first month rather than dropped: money that fell due
     last quarter is still money you can go and ask for. */
  const bucketFor = due => keys.includes(monthKey(due))
    ? monthKey(due)
    : (due < today() ? keys[0] : null);
  DB.projects.forEach(p=>{
    const r=retentionPosition(p);
    if(r.held<=0) return;
    if(r.firstDue){ const k=bucketFor(r.firstDue);
      if(k) add("Retention released",k,Math.min(r.half,r.held)); }
    if(r.secondDue){ const k=bucketFor(r.secondDue);
      if(k) add("Retention released",k,Math.max(R2(r.held-r.half),0)); }
  });

  /* work still to certify, spread over what is left of the job */
  DB.projects.forEach(p=>{
    const cc=costCodes(p.id); if(!cc.length) return;
    const wd=workDone(p);
    const remaining=R2(wd.contract-wd.vowd); if(remaining<=0) return;
    const monthsLeft=Math.max(1,Math.min(keys.length,
      Math.ceil(Math.max(daysBetween(today(),p.end),30)/30)));
    const perMonth=R2(remaining/monthsLeft*(1-(p.retention||0)/100));
    keys.slice(0,monthsLeft).forEach(k=>add("Work to be certified",k,perMonth));
  });

  /* money out: bills already received */
  openDocs("PI").filter(d=>d.open>0.005).forEach(d=>{
    const k=keys.includes(monthKey(d.due))?monthKey(d.due):(d.due<today()?keys[0]:null);
    if(k) add("Supplier payments",k,-d.open);
  });

  /* orders placed and not yet delivered */
  (DB.orders||[]).filter(o=>["Open","Part received"].includes(o.status)).forEach(o=>{
    const due=addDays(o.delivery||today(),30);
    add("Purchase orders",monthKey(due),-poOpen(o));
  });

  /* subcontract work still to be certified */
  (DB.packages||[]).filter(p=>p.status==="Awarded").forEach(pk=>{
    const left=R2(pk.value-pkgCertified(pk.id)); if(left<=0) return;
    const proj=DB.projects.find(x=>x.id===pk.project);
    const monthsLeft=Math.max(1,Math.min(keys.length,
      Math.ceil(Math.max(daysBetween(today(),proj?proj.end:today()),30)/30)));
    const per=R2(left/monthsLeft*(1-(pk.retentionPct||0)/100));
    keys.slice(0,monthsLeft).forEach(k=>add("Subcontractors",k,-per));
  });

  /* wages and overheads keep going out whatever happens */
  const payroll=R2(DB.employees.filter(e=>e.active).reduce((s,e)=>s+e.basic+e.allow,0));
  const overhead=avgMonthlyOverhead();
  keys.forEach(k=>{ add("Payroll",k,-payroll); add("Overheads",k,-overhead); });

  return {keys,rows,opening:cashBalance()};
}

/* what the overheads have actually been running at */
function avgMonthlyOverhead(){
  const codes=postable().filter(a=>a.type==="EXPENSE"&&!["6800","6810","6105","6125"].includes(a.code));
  const from=addDays(today(),-90);
  const spent=R2(codes.reduce((s,a)=>s+Ledger.show(a.code,{from,to:today()}),0));
  return R2(spent/3);
}

const FORECAST_IN =["Customer receipts","Retention released","Work to be certified"];
const FORECAST_OUT=["Supplier payments","Purchase orders","Subcontractors","Payroll","Overheads"];

function repCashflow(){
  const f=cashForecast(6);
  const val=(b,k)=>R2((f.rows[b]&&f.rows[b][k])||0);
  let running=f.opening;
  const closing={};
  f.keys.forEach(k=>{
    const net=R2(FORECAST_IN.concat(FORECAST_OUT).reduce((s,b)=>s+val(b,k),0));
    running=R2(running+net); closing[k]=running;
  });

  const row=(label,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+esc(t(label))+'</td>'+
    f.keys.map(k=>'<td class="num">'+money(val(label,k))+'</td>').join("")+
    '<td class="num">'+money(R2(f.keys.reduce((s,k)=>s+val(label,k),0)))+'</td></tr>';

  let html='<table><thead><tr><td></td>'+f.keys.map(k=>'<th class="num">'+esc(monthLabel(k))+'</th>').join("")+
    '<th class="num">'+esc(t("Total"))+'</th></tr></thead><tbody>';
  html+='<tr class="sub"><td>'+esc(t("Opening bank and cash"))+'</td><td class="num">'+money(f.opening)+
    '</td>'+f.keys.slice(1).map(k=>'<td class="num">'+money(closing[f.keys[f.keys.indexOf(k)-1]])+'</td>').join("")+
    '<td></td></tr>';
  html+='<tr class="head"><td colspan="'+(f.keys.length+2)+'">'+esc(t("Money in"))+'</td></tr>';
  FORECAST_IN.forEach(b=>html+=row(b));
  html+='<tr class="head"><td colspan="'+(f.keys.length+2)+'">'+esc(t("Money out"))+'</td></tr>';
  FORECAST_OUT.forEach(b=>html+=row(b));
  html+='<tr class="sub"><td>'+esc(t("Net movement"))+'</td>'+
    f.keys.map(k=>{const n=R2(FORECAST_IN.concat(FORECAST_OUT).reduce((s,b)=>s+val(b,k),0));
      return '<td class="num'+(n<0?" neg":"")+'">'+money(n)+'</td>';}).join("")+'<td></td></tr>';
  html+='<tr class="total"><td>'+esc(t("Closing bank and cash"))+'</td>'+
    f.keys.map(k=>'<td class="num'+(closing[k]<0?" neg":"")+'">'+money(closing[k])+'</td>').join("")+
    '<td></td></tr></tbody></table>';

  const node=h('<div class="scroll">'+html+'</div>');
  const low=f.keys.filter(k=>closing[k]<0);
  const tight=f.keys.filter(k=>closing[k]>=0&&closing[k]<200000);
  if(low.length) node.appendChild(h('<p style="margin-top:12px" class="neg"><b>'+esc(isAR()
    ?"الرصيد يصبح سالباً في "+low.map(monthLabel).join("، ")
    :"Cash goes negative in "+low.map(monthLabel).join(", "))+'</b></p>'));
  else if(tight.length) node.appendChild(h('<p style="margin-top:12px" style="color:var(--amber)">'+esc(isAR()
    ?"الرصيد يقترب من الحد في "+tight.map(monthLabel).join("، ")
    :"Cash gets tight in "+tight.map(monthLabel).join(", "))+'</p>'));
  node.appendChild(h('<p style="margin-top:8px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"الفواتير القائمة تُدرج في شهر استحقاقها. الأعمال المتبقية تُوزَّع على ما بقي من مدة كل عقد بعد خصم المحتجزات. الرواتب والمصروفات العمومية بمعدل آخر ثلاثة أشهر."
    :"Invoices already raised fall in the month they are due. Work still to certify is spread over what is left of each contract, net of retention. Payroll and overheads run at the last three months' rate.")+'</p>'));
  return sheet("Cash Flow Forecast",tp("forPeriod",monthLabel(f.keys[0]),monthLabel(f.keys[f.keys.length-1])),node);
}

/* ---------- work in progress ----------
   The auditor's question: what has been earned, what has been
   billed, and which way round is the difference. */
function repWIP(){
  const rows=[];
  DB.projects.forEach(p=>{
    const cc=costCodes(p.id); if(!cc.length) return;
    const wd=workDone(p);
    const forecast=R2(cc.reduce((s,c)=>s+ccForecast(c),0));
    const pctCost = forecast? Math.round(wd.cost/forecast*1000)/10 : 0;
    rows.push({p,contract:wd.contract,cost:wd.cost,forecast,pctCost,
      pctMeasured:wd.pctComplete,earned:wd.vowd,billed:wd.certified,
      under:Math.max(R2(wd.vowd-wd.certified),0),
      over:Math.max(R2(wd.certified-wd.vowd),0)});
  });
  const tot=k=>R2(rows.reduce((s,r)=>s+r[k],0));
  let html='<table><thead><tr>'+
    ['Project','Contract value','Cost to date','Forecast cost','% by cost','% measured',
     'Revenue earned','Billed to date','Under-billed','Over-billed']
      .map((x,i)=>'<th'+(i?' class="num"':'')+'>'+esc(t(x))+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr><td class="code">'+esc(r.p.code)+'</td><td class="num">'+money(r.contract)+
      '</td><td class="num">'+money(r.cost)+'</td><td class="num">'+money(r.forecast)+
      '</td><td class="num">'+r.pctCost+'%</td><td class="num">'+r.pctMeasured+
      '%</td><td class="num">'+money(r.earned)+'</td><td class="num">'+money(r.billed)+
      '</td><td class="num">'+(r.under?money(r.under):"—")+
      '</td><td class="num'+(r.over?" neg":"")+'">'+(r.over?money(r.over):"—")+'</td></tr>';
  });
  html+='<tr class="total"><td>'+esc(t("Total"))+'</td><td class="num">'+money(tot("contract"))+
    '</td><td class="num">'+money(tot("cost"))+'</td><td class="num">'+money(tot("forecast"))+
    '</td><td colspan="2"></td><td class="num">'+money(tot("earned"))+'</td><td class="num">'+
    money(tot("billed"))+'</td><td class="num">'+money(tot("under"))+'</td><td class="num">'+
    money(tot("over"))+'</td></tr></tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  node.appendChild(h('<table style="margin-top:16px;max-width:520px">'+
    '<tr class="sub"><td>'+esc(isAR()?"أعمال منجزة تتجاوز ما فُوتر — أصل"
      :"Costs and earnings in excess of billings — an asset")+'</td><td class="num">'+
      money(tot("under"))+'</td></tr>'+
    '<tr class="sub"><td>'+esc(isAR()?"فوترة تتجاوز الأعمال المنجزة — التزام"
      :"Billings in excess of costs and earnings — a liability")+'</td><td class="num">'+
      money(tot("over"))+'</td></tr></table>'));
  node.appendChild(h('<p style="margin-top:10px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"نسبة الإنجاز بالتكلفة تُقارن التكلفة المتكبدة بالتكلفة المتوقعة؛ ونسبة الإنجاز بالقياس تأتي من جدول الكميات. تباعدهما إشارة إلى أن العمل يكلّف أكثر مما سُعِّر، أو أن القياس متفائل."
    :"Percentage by cost compares cost incurred with forecast cost. Percentage measured comes from the bill of quantities. When the two drift apart, either the work is costing more than it was priced at or the measurement is optimistic.")+'</p>'));
  return sheet("Work in Progress",tp("asAt",fmtDate(today())),node);
}

/* ---------- bank reconciliation ---------- */
const reconciled = () => DB.reconciled||{};
const isCleared = (acct,lineKey) => !!(reconciled()[acct]||{})[lineKey];
const lineKey = r => r.jid+":"+r.no+":"+r.dr+":"+r.cr;

function bankRecView(m,acct){
  const rows=Ledger.rows(acct,{}).filter(r=>!isCleared(acct,lineKey(r)));
  const bookBalance=Ledger.bal(acct);
  const rec=(DB.recStatements||{})[acct]||{date:today(),balance:"0"};
  const uncleared=R2(rows.reduce((s,r)=>s+R2(r.dr-r.cr),0));
  const perStatement=M2(rec.balance);
  const difference=R2(bookBalance-uncleared-perStatement);

  const g=h('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))"></div>');
  g.appendChild(stat("Balance per books",money(bookBalance)));
  g.appendChild(stat("Unreconciled items",money(uncleared),rows.length+" "+(isAR()?"بند":"items")));
  g.appendChild(stat("Balance per statement",money(perStatement)));
  g.appendChild(stat("Difference",money(difference),"",Math.abs(difference)>0.004?"neg":"pos"));
  m.appendChild(g);
  m.appendChild(h('<div style="height:14px"></div>'));

  const bar=h('<div class="bar"></div>');
  const dateF=field({n:"rdate",label:"Statement date",type:"date",value:rec.date});
  const balF=field({n:"rbal",label:"Closing balance per statement (QR)",type:"number",value:rec.balance});
  [dateF,balF].forEach(f=>bar.appendChild(f));
  const save=h('<button class="btn">'+esc(t("Save"))+'</button>');
  save.onclick=()=>{ DB.recStatements=DB.recStatements||{};
    DB.recStatements[acct]={date:dateF.querySelector("input").value,
      balance:balF.querySelector("input").value}; commit("Saved"); };
  bar.appendChild(save);
  m.appendChild(bar);

  if(Math.abs(difference)<0.005&&rows.length===0)
    m.appendChild(h('<div class="card" style="border-color:var(--ledger-green,#14624A);background:var(--ledger-soft,#E4F0EB);margin-bottom:14px"><div class="body"><b style="color:var(--ledger-green,#14624A)">'+
      esc(isAR()?"الحساب مطابق.":"The account is reconciled.")+'</b></div></div>'));
  else if(Math.abs(difference)>0.005)
    m.appendChild(h('<div class="card" style="border-color:var(--amber);background:var(--amber-soft);margin-bottom:14px"><div class="body"><b style="color:var(--amber)">'+
      esc(isAR()?"فرق قدره "+money(difference)+" لم يُفسَّر بعد"
        :money(difference)+" is still unexplained")+'</b><br><span style="color:var(--ink-soft)">'+
      esc(isAR()?"علّم البنود التي ظهرت في كشف البنك حتى يصل الفرق إلى صفر."
        :"Tick the items that appear on the bank statement until the difference reaches zero.")+'</span></div></div>'));

  const tbl=table([
    {h:"",w:"30px",r:r=>'<input type="checkbox" data-k="'+esc(lineKey(r))+'">'},
    {h:"Date",r:r=>fmtDate(r.date)},
    {h:"Voucher",r:r=>'<span class="code">'+esc(r.no)+'</span>'},
    {h:"Source",r:r=>'<span class="tag">'+esc(t(r.source))+'</span>'},
    {h:"Detail",r:r=>esc(r.memo)},
    {h:"Paid in",num:1,r:r=>r.dr?money(r.dr):""},
    {h:"Paid out",num:1,r:r=>r.cr?money(r.cr):""}
  ],rows.slice().reverse(),{emptyTitle:"Everything is reconciled",
    emptyBody:isAR()?"لا توجد بنود غير مطابقة على هذا الحساب."
      :"There are no unreconciled items on this account."});
  const c=card("Items not yet on a bank statement",tbl,[]);
  m.appendChild(c);

  if(rows.length){
    const btn=h('<button class="btn pri" style="margin-top:12px">'+
      esc(isAR()?"تعليم البنود المحددة كمطابَقة":"Mark ticked items as cleared")+'</button>');
    btn.onclick=()=>{
      const keys=[...c.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.getAttribute("data-k"));
      if(!keys.length) return toast(isAR()?"لم تُحدَّد أي بنود.":"Nothing ticked.");
      DB.reconciled=DB.reconciled||{}; DB.reconciled[acct]=DB.reconciled[acct]||{};
      keys.forEach(k=>DB.reconciled[acct][k]=true);
      commit(keys.length+" "+(isAR()?"بند مطابَق":"items cleared"));
    };
    m.appendChild(btn);
  }
}
const M2 = v => M2parse(v);
function M2parse(v){ return R2(Number(String(v||0))||0); }

view("treasury",{label:"Bank Reconciliation",code:"REC",group:"Treasury & Stock",render(m){
  const accts=cashAccounts();
  const tv=tabs("rec",accts.map(a=>[a.code,acctName(a.code).replace(/^(Bank — |بنك — )/,"")]));
  m.appendChild(page("Bank Reconciliation",
    isAR()?"حتى تُطابق الحساب، رقم النقدية مجرد رأي"
      :"Until the account is reconciled, the cash figure is an opinion.",[]));
  m.appendChild(tv.el);
  bankRecView(m,tv.cur);
}});

/* ==================== ROLE DASHBOARDS ====================
   A storekeeper does not need the balance sheet and an engineer
   does not need the ageing. Each role opens on the things it can
   actually do something about. */
function roleDashboard(m,role){
  if(role==="Project Engineer"){
    const late=lateProjects();
    const over=[];
    DB.projects.forEach(p=>costCodes(p.id).forEach(c=>{
      if(R2(ccBudget(c)-ccForecast(c))<0) over.push({p,c}); }));
    const unsigned=(DB.dayworks||[]).filter(x=>x.status==="Draft");
    const g=h('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>');
    g.appendChild(stat("Overdue projects",late.length,"",late.length?"neg":"pos"));
    g.appendChild(stat("Cost codes over budget",over.length,"",over.length?"neg":"pos"));
    g.appendChild(stat("Unsigned day-works",unsigned.length,"",unsigned.length?"neg":""));
    const lateMs=(typeof lateMilestones==="function")?lateMilestones():[];
    g.appendChild(stat("Milestones late",lateMs.length,"",lateMs.length?"neg":"pos"));
    g.appendChild(stat("Expiring documents",expiringCount(),"",expiringCount()?"neg":""));
    m.appendChild(g); m.appendChild(h('<div style="height:14px"></div>'));
    if(over.length) m.appendChild(card("Cost codes forecast over budget",table([
      {h:"Project",r:x=>'<span class="code">'+esc(x.p.code)+'</span>'},
      {h:"Code",r:x=>'<span class="code">'+esc(x.c.code)+'</span>'},
      {h:"Description",r:x=>esc(x.c.desc)},
      {h:"Budget",num:1,r:x=>money(ccBudget(x.c))},
      {h:"Forecast",num:1,r:x=>money(ccForecast(x.c))},
      {h:"Variance",num:1,cls:()=>"neg",r:x=>money(R2(ccBudget(x.c)-ccForecast(x.c)))}
    ],over)));
    return true;
  }
  if(role==="Store Keeper"){
    const low=DB.items.filter(i=>i.qty<=i.reorder);
    const awaiting=(DB.grns||[]).filter(g2=>!grnInvoiced(g2.id));
    const g=h('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>');
    g.appendChild(stat("Items at reorder level",low.length,"",low.length?"neg":"pos"));
    g.appendChild(stat("Stock value",money(stockValue())));
    g.appendChild(stat("Receipts awaiting invoice",awaiting.length));
    g.appendChild(stat("Open orders",(DB.orders||[]).filter(o=>["Open","Part received"].includes(o.status)).length));
    m.appendChild(g); m.appendChild(h('<div style="height:14px"></div>'));
    if(low.length) m.appendChild(card("Below reorder level",table([
      {h:"Code",r:i=>'<span class="code">'+esc(i.code)+'</span>'},
      {h:"Description",r:i=>esc(i.name)},

/* ============================================================
   MIZAN demo · 14 · imports, pricing and paperwork

   Multi-currency is not a display preference. You agree a price in
   dollars, the rate moves before you pay, and the difference is a
   real gain or loss that has to land somewhere. The books stay in
   riyals; the document remembers what was actually agreed.

   A letter of credit ties up cash in margin long before the goods
   arrive, and expires whether or not the shipment made it.

   Price lists, attachments and an outbox are the unglamorous parts
   that decide whether anyone actually uses the system.
   ============================================================ */

const CURRENCIES=[
  ["QAR","Qatari Riyal","ريال قطري",1],
  ["USD","US Dollar","دولار أمريكي",3.64],        /* the riyal is pegged */
  ["EUR","Euro","يورو",3.95],
  ["AED","UAE Dirham","درهم إماراتي",0.9913],
  ["GBP","Pound Sterling","جنيه إسترليني",4.62],
  ["INR","Indian Rupee","روبية هندية",0.0437],
  ["CNY","Chinese Yuan","يوان صيني",0.5010]
];
const ccy = code => CURRENCIES.find(c=>c[0]===code)||CURRENCIES[0];
const ccyName = code => { const c=ccy(code); return isAR()?c[2]:c[1]; };
const ccyRate = code => (DB.fxRates&&DB.fxRates[code]!=null) ? +DB.fxRates[code] : ccy(code)[3];
const fx = (amount,rate) => R2(R2(amount)*(+rate||1));

const lcs = () => DB.lcs||[];
const priceLists = () => DB.priceLists||[];
const attachments = () => DB.attachments||[];
const outbox = () => DB.outbox||[];

/* The price a particular customer should see for an item, from the
   most specific list that applies today. */
function priceFor(itemId,customerId){
  const it=DB.items.find(i=>i.id===itemId);
  const base=it?it.price:0;
  const today_=today();
  const lists=priceLists().filter(l=>
    (!l.from||l.from<=today_)&&(!l.to||l.to>=today_)&&
    (l.customer===customerId||!l.customer));
  /* a list naming this customer beats the general one */
  lists.sort((a,b)=>(b.customer?1:0)-(a.customer?1:0));
  for(const l of lists){
    const line=(l.lines||[]).find(x=>x.item===itemId);
    if(line) return {price:R2(line.price),list:l.name,customerSpecific:!!l.customer};
  }
  return {price:base,list:isAR()?"سعر القائمة":"Standard price",customerSpecific:false};
}

/* The purchase document behind a voucher number, if it was agreed
   in a currency other than the riyal. */
function fxDocOf(no){
  if(!no) return null;
  const j=DB.journals.find(x=>x.doc&&x.doc.no===no&&x.source==="Purchase Invoice");
  const d=j&&j.doc;
  return (d&&d.currency&&d.currency!=="QAR"&&d.fxGross) ? d : null;
}

/* What the payment actually costs in riyals against what the
   liability was booked at. Positive is a loss. */
function fxDifference(d,v){
  const payRate=+v.payRate||d.fxRate;
  const foreignShare=R2(R2(v.amt)/d.fxRate);        /* the slice being settled */
  return R2(R2(foreignShare*payRate)-R2(v.amt));
}

      {n:"cash",label:"Margin and charges paid from",type:"select",options:cashOptions(),value:tagCode("bank")}
    ],

      const qar=fx(v.amount,v.rate);
      const margin=R2(qar*(+v.marginPct||0)/100);
      const charges=R2(qar*(+v.chargesPct||0)/100);
      if(!margin&&!charges) return [];
      const L=[];
      if(margin) L.push({account:"1165",dr:margin,cr:0,party:v.party,memo:"LC cash margin "+(v.number||"")});
      if(charges) L.push({account:"6700",dr:charges,cr:0,memo:"LC opening charges"});
      L.push({account:v.cash,dr:0,cr:R2(margin+charges),memo:"Letter of credit "+(v.number||"")});
      return L;
    },
    note:v=>{
      const qar=fx(v.amount,v.rate);
      const margin=R2(qar*(+v.marginPct||0)/100);
      const charges=R2(qar*(+v.chargesPct||0)/100);
      return '<span class="code">'+esc(v.currency)+'</span> '+money(v.amount)+" × "+v.rate+
        " = <b>"+qr(qar)+"</b>"+

        esc(isAR()?"مصاريف بنكية":"Bank charges")+" "+money(charges)+
        "<br><span style='color:var(--ink-soft)'>"+esc(isAR()
          ?"الهامش يُقيَّد كتأمين مسترد لا كمصروف؛ يظل أصلاً حتى تسوية الاعتماد، لكنه نقد لا يمكنك استخدامه."
          :"The margin is a refundable deposit, not a cost. It stays an asset until the credit settles, but it is cash you cannot use.")+"</span>";
    },
    save:v=>{
      guardPost();
      if(R2(v.amount)<=0) throw new Error("Enter the credit amount.");
      const ref=nextNo("LC");
      const qar=fx(v.amount,v.rate);
      const margin=R2(qar*(+v.marginPct||0)/100), charges=R2(qar*(+v.chargesPct||0)/100);
      if(margin||charges) Ledger.post({no:nextNo("PV"),date:v.issued,source:"Payment",
        memo:"Letter of credit "+ref+(v.number?" · "+v.number:""),lines:formDocJournal.lines,
        doc:{no:ref,from:v.cash}});

        number:v.number,currency:v.currency,rate:+v.rate,amount:R2(v.amount),
        marginPct:+v.marginPct||0,chargesPct:+v.chargesPct||0,
        issued:v.issued,shipment:v.shipment,expires:v.expires,status:"Issued"}]);
      commit("Letter of credit "+ref+" opened");
    }});
}

/* ============================================================
   MIZAN demo · 15 · programme and prequalification

   A contract has more dates in it than a start and an end. It has
   gates: possession of site, mobilisation, first fix complete,
   testing witnessed, taking over. Missing one of those is how a job
   ends up late, and the end date only tells you afterwards.

   Prequalification is the other thing that quietly stops work.
   Nobody can tender without current ISO certificates, audited
   accounts and a bank capability letter, and they all expire.
   ============================================================ */

const milestones = pid => (DB.milestones||[]).filter(m=>!pid||m.project===pid)
  .sort((a,b)=>(a.plannedOn<b.plannedOn?-1:1));

function msState(m){
  if(m.actualOn) return {key:"done",tone:"green",
    label:isAR()?"مُنجز":"Complete",
    slip:daysBetween(m.plannedOn,m.actualOn)};
  const due=m.forecastOn||m.plannedOn;
  const days=daysBetween(today(),due);
  const slip=daysBetween(m.plannedOn,due);
  if(days<0) return {key:"late",tone:"red",label:isAR()?"متأخر":"Late",days,slip};
  if(days<=14) return {key:"soon",tone:"amber",label:isAR()?"قريباً":"Due soon",days,slip};
  return {key:"ok",tone:"",label:isAR()?"ضمن الجدول":"On track",days,slip};
}

/* Progress by programme: the weight of the gates actually passed.
   Worth comparing with progress by measurement, because a job can
   be 60% measured and still have missed every gate that matters. */
function programmeProgress(pid){
  const ms=milestones(pid);
  const total=R2(ms.reduce((s,m)=>s+(+m.weight||0),0));
  const done=R2(ms.filter(m=>m.actualOn).reduce((s,m)=>s+(+m.weight||0),0));
  return {total,done,pct: total? Math.round(done/total*1000)/10 : 0,
    late: ms.filter(m=>msState(m).key==="late").length,
    next: ms.find(m=>!m.actualOn)};
}

/* Can we bid today? Only if nothing essential has lapsed. */
function pqReadiness(){
  const essential=["ISO9001","ISO45001","AUDITED","BANK","CLASSIF"];
  const missing=[], expired=[];
  essential.forEach(k=>{
    const doc=pqDocs().find(x=>x.kind===k);
    if(!doc) missing.push(pqLabel(k));
    else if(daysBetween(today(),doc.expires)<0) expired.push(pqLabel(k));
  });
  return {ready:!missing.length&&!expired.length,missing,expired};
}

const counts = () => DB.stockCounts||[];
const batches = () => DB.batches||[];

/* ---------- physical stock count ---------- */
function countForm(){
  formDoc({title:"Physical stock count",wide:true,saveLabel:"Record the count",
    fields:()=>[
      {n:"date",label:"Count date",type:"date",value:today()},
      {n:"by",label:"Counted by",value:(DB.users.find(u=>u.id===DB.currentUser)||{}).name||""},
      {n:"witness",label:"Witnessed by",value:"",hint:"A count nobody witnessed is one person's opinion"},
      {n:"lines",label:"Counted",type:"lines",full:true,
        newRow:()=>({item:(DB.items[0]||{}).id,counted:0}),
        value:DB.items.map(i=>({item:i.id,counted:i.qty})),
        cols:[
          {h:"Item",n:"item",type:"select",w:"36%",options:DB.items.map(i=>({v:i.id,l:i.code+" · "+i.name}))},
          {h:"Per the books",num:1,calc:r=>{const i=DB.items.find(x=>x.id===r.item);return i?i.qty:0;}},
          {h:"Counted",n:"counted",type:"number",num:1,w:"14%"},
          {h:"Difference",num:1,calc:r=>{const i=DB.items.find(x=>x.id===r.item);
            return i?R2((+r.counted||0)-i.qty):0;}},
          {h:"Value",num:1,calc:r=>{const i=DB.items.find(x=>x.id===r.item);
            return i?R2(((+r.counted||0)-i.qty)*i.cost):0;}}
        ]}
    ],
    journal:v=>{
      const L=[]; let up=0,down=0;
      (v.lines||[]).forEach(l=>{
        const i=DB.items.find(x=>x.id===l.item); if(!i) return;
        const diff=R2((+l.counted||0)-i.qty); if(!diff) return;
        const val=R2(diff*i.cost);
        if(val>0){ L.push({account:i.acct,dr:val,cr:0,itemId:i.id,memo:"Stock count — "+i.name}); up=R2(up+val); }
        else { L.push({account:i.acct,dr:0,cr:-val,itemId:i.id,memo:"Stock count — "+i.name}); down=R2(down-val); }
      });
      if(!L.length) return [];
      const net=R2(up-down);
      L.push({account:"5250",dr:net<0?-net:0,cr:net>0?net:0,memo:"Stock count adjustment"});
      return L;
    },
    note:v=>{
      const diffs=(v.lines||[]).map(l=>{const i=DB.items.find(x=>x.id===l.item);
        return i?{i,q:R2((+l.counted||0)-i.qty),val:R2(((+l.counted||0)-i.qty)*i.cost)}:null;})
        .filter(x=>x&&x.q);
      if(!diffs.length) return esc(isAR()?"الجرد مطابق للدفاتر تماماً."
        :"The count agrees with the books exactly.");
      const net=R2(diffs.reduce((s,x)=>s+x.val,0));
      let out=diffs.length+" "+esc(isAR()?"صنفاً به فرق":"item"+(diffs.length>1?"s differ":" differs"))+
        " &nbsp;·&nbsp; "+esc(isAR()?"صافي الأثر":"net effect")+" <b>"+qr(net)+"</b><br>"+
        diffs.slice(0,4).map(x=>esc(x.i.name+" "+(x.q>0?"+":"")+money(x.q))).join(" · ");
      if(!v.witness) out+='<br><span style="color:var(--amber)">'+esc(isAR()
        ?"لا يوجد شاهد على الجرد."
        :"Nobody has witnessed this count.")+'</span>';
      out+='<br><span style="color:var(--ink-soft)">'+esc(isAR()
        ?"يُقيَّد الفرق فوراً على فروق الجرد؛ الاعتماد يُسجَّل بعده ولا يؤجل القيد."
        :"The difference posts to stock differences straight away. Approval is recorded against it, not before it.")+'</span>';
      return out;
    },
    save:v=>{
      guardPost();
      const lines=(v.lines||[]).map(l=>{
        const i=DB.items.find(x=>x.id===l.item);
        return i?{item:l.item,book:i.qty,counted:R2(l.counted),
          diff:R2(R2(l.counted)-i.qty),value:R2((R2(l.counted)-i.qty)*i.cost)}:null;
      }).filter(Boolean);
      const moved=lines.filter(l=>l.diff);
      if(!moved.length) throw new Error("Nothing differs from the books.");
      const ref=nextNo("SC#");
      const e=Ledger.post({no:ref,date:v.date,source:"Stock Count",
        memo:"Physical stock count "+ref,lines:formDocJournal.lines});
      moved.forEach(l=>{ const i=DB.items.find(x=>x.id===l.item);
        i.qty=l.counted; i.val=R2(i.qty*i.cost);
        DB.stockMoves.push({id:"M"+Date.now()+Math.floor(Math.random()*99),date:v.date,
          item:l.item,qty:l.diff,cost:i.cost,value:l.value,ref,project:"",
          balance:i.qty,wac:i.cost}); });
      DB.stockCounts=(DB.stockCounts||[]).concat([{id:"CT"+Date.now(),ref,date:v.date,
        by:v.by,witness:v.witness,lines,net:R2(moved.reduce((s,l)=>s+l.value,0)),
        approved:false,entry:e.id}]);
      commit("Count "+ref+" recorded");
    }});
}

/* ---------- staff accommodation and transport ----------
   Camp rent and bus hire are real costs of having men on a job.
   Left in overheads, every project looks more profitable than it is. */
function staffCostForm(){
  formDoc({title:"Allocate accommodation and transport",wide:true,saveLabel:"Post the allocation",
    fields:()=>[
      {n:"month",label:"Month ending",type:"date",value:monthEnd(today())},
      {n:"accommodation",label:"Accommodation cost for the month (QR)",type:"number",value:0},
      {n:"transport",label:"Transport cost for the month (QR)",type:"number",value:0},
      {n:"basis",label:"Spread by",type:"select",
       options:[{v:"heads",l:isAR()?"عدد العمال في كل مشروع":"Number of men on each project"},
                {v:"hours",l:isAR()?"الساعات المسجَّلة في الجداول":"Hours booked on timesheets"}],
       value:"heads"}
    ],
    journal:v=>{
      const total=R2(R2(v.accommodation)+R2(v.transport));
      if(total<=0) return [];
      const shares=staffCostShares(v.basis);
      if(!shares.length) return [];
      const L=[];
      let spread=0;
      shares.forEach((sh,i)=>{
        const amt = i===shares.length-1 ? R2(total-spread) : R2(total*sh.weight);
        spread=R2(spread+amt);
        if(amt) L.push({account:"5240",dr:amt,cr:0,project:sh.project,
          memo:"Accommodation and transport"});
      });
      L.push({account:"6110",dr:0,cr:R2(v.accommodation),memo:"Accommodation recharged to projects"});
      L.push({account:"6116",dr:0,cr:R2(v.transport),memo:"Transport recharged to projects"});
      return L;
    },
    note:v=>{
      const shares=staffCostShares(v.basis);
      const total=R2(R2(v.accommodation)+R2(v.transport));
      if(!shares.length) return '<span style="color:var(--maroon)">'+esc(isAR()
        ?"لا يوجد ما يُوزَّع عليه." :"There is nothing to spread it over.")+'</span>';
      return esc(isAR()?"يُوزَّع":"Spread")+" <b>"+qr(total)+"</b> "+esc(isAR()?"على":"across")+" "+
        shares.length+" "+esc(isAR()?"مشروعاً":"projects")+"<br>"+
        shares.map(s=>esc(projCode(s.project))+" "+Math.round(s.weight*1000)/10+"%").join(" · ")+
        "<br><span style='color:var(--ink-soft)'>"+esc(isAR()
          ?"إيجار السكن وحافلات النقل تكلفة حقيقية لوجود العمال على المشروع؛ تركها في المصروفات العمومية يجعل كل مشروع يبدو أربح مما هو."
          :"Camp rent and bus hire are a real cost of having men on a job. Left in overheads, every project looks more profitable than it is.")+"</span>";
    },
    save:v=>{
      guardPost();
      if(R2(R2(v.accommodation)+R2(v.transport))<=0) throw new Error("Enter the costs to allocate.");
      Ledger.post({no:nextNo("JV"),date:monthEnd(v.month),source:"Allocation",
        memo:"Accommodation and transport allocated to projects",lines:formDocJournal.lines});
      commit("Allocated");
    }});
}

function staffCostShares(basis){
  const live=DB.projects.filter(p=>!["Completed","Closed"].includes(p.status));
  let raw=[];
  if(basis==="hours"){
    raw=live.map(p=>({project:p.id,n:R2((DB.timesheets||[])
      .filter(ts=>ts.project===p.id)
      .reduce((s,ts)=>s+R2((ts.lines||[]).reduce((x,l)=>x+(+l.normal||0)+(+l.ot||0),0)),0))}));
  } else {
    raw=live.map(p=>({project:p.id,n:DB.employees.filter(e=>e.active&&e.project===p.id).length}));
  }
  const total=raw.reduce((s,x)=>s+x.n,0);
  if(!total) return [];
  return raw.filter(x=>x.n).map(x=>({project:x.project,weight:x.n/total}));
}

/* ==================== APPROVALS ====================
   One queue. A signature that has to be hunted for does not get
   given, and the control quietly stops working. */
function approvalQueue(){
  const out=[];
  (DB.requisitions||[]).filter(r=>r.status==="Draft").forEach(r=>out.push({
    kind:isAR()?"طلب شراء":"Requisition",ref:r.ref,date:r.date,
    who:r.by,detail:(r.lines||[]).map(l=>itemName(l.item)||l.desc).join(", ").slice(0,50),
    amount:R2((r.lines||[]).reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0)),
    act:()=>{ r.status="Approved"; commit("Approved "+r.ref); }}));
  (DB.variations||[]).filter(v=>v.status==="Submitted").forEach(v=>out.push({
    kind:isAR()?"أمر تغيير":"Variation",ref:v.ref,date:v.date,who:projCode(v.project),
    detail:v.title,amount:v.sell,
    act:()=>{ const p=DB.projects.find(x=>x.id===v.project); if(p) approveVariationFromQueue(v,p); }}));
  (DB.dayworks||[]).filter(x=>x.status==="Draft").forEach(x=>out.push({
    kind:isAR()?"أعمال يومية":"Day-work",ref:x.ref,date:x.date,who:projCode(x.project),
    detail:x.instruction||"—",amount:dwValue(x),
    act:()=>{ x.signedBy=(DB.users.find(u=>u.id===DB.currentUser)||{}).name||"";
      x.status="Signed"; commit("Signed "+x.ref); }}));
  (DB.stockCounts||[]).filter(c=>!c.approved).forEach(c=>out.push({
    kind:isAR()?"جرد المخزون":"Stock count",ref:c.ref,date:c.date,who:c.by,
    detail:c.lines.filter(l=>l.diff).length+(isAR()?" صنفاً به فرق":" items differ"),
    amount:c.net,act:()=>{ c.approved=true; c.approvedBy=(DB.users.find(u=>u.id===DB.currentUser)||{}).name;
      commit("Approved "+c.ref); }}));
  (DB.journals||[]).filter(j=>j.doc&&j.doc.pending).forEach(j=>out.push({
    kind:isAR()?"دفعة":"Payment",ref:j.no,date:j.date,who:j.by,detail:j.memo,
    amount:j.dr,act:()=>{ j.doc.pending=false; commit("Approved "+j.no); }}));
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

function approveVariationFromQueue(v,p){
  v.status="Approved"; v.decidedOn=today();
  DB.costCodes=(DB.costCodes||[]).concat([{id:"CC"+Date.now(),project:v.project,
    code:"VO-"+v.ref.split("-").pop(),section:"Variations",desc:v.title,unit:"SUM",qty:1,
    budget:{material:0,labour:0,plant:0,subcontract:0,other:v.cost},sell:v.sell}]);
  p.value=R2(p.value+v.sell);
  commit("Approved "+v.ref);
}

/* ==================== TAX WORKINGS ====================
   Qatar charges corporate income tax on the share of profit
   attributable to foreign ownership. A wholly Qatari-owned company
   is exempt but still files. The rate and the adjustments belong to
   your accountant; the arithmetic belongs here. */
function repTax(){
  const from=DB.settings.fyStart, to=today();
  /* Ledger.show already returns revenue as a positive figure, the
     same way the profit and loss reads it. Negating it here made the
     accounting profit come out as a large loss. */
  const revenue=R2(Ledger.typeTotal("REVENUE",{from,to}));
  const cos=R2(Ledger.typeTotal("COS",{from,to}));
  const exp=R2(Ledger.typeTotal("EXPENSE",{from,to}));
  const profit=R2(revenue-cos-exp);
  const foreignPct=+DB.settings.foreignOwnershipPct||0;
  const rate=+DB.settings.taxRatePct||10;
  const taxable=R2(profit*foreignPct/100);
  const tax=R2(taxable*rate/100);
  const row=(l,v2,b)=>'<tr'+(b?' class="sub"':'')+'><td>'+esc(l)+'</td><td class="num">'+money(v2)+'</td></tr>';
  const node=h('<div class="scroll"><table style="max-width:620px">'+
    row(t("Revenue"),revenue)+row(t("Cost of sales"),-cos)+row(t("Expenses"),-exp)+
    row(t("Accounting profit"),profit,true)+
    '<tr><td colspan="2" style="padding-top:10px;color:var(--ink-soft);font-size:12px">'+
      esc(isAR()?"قبل التسويات الضريبية التي يحددها المحاسب القانوني"
        :"before the tax adjustments your auditor will determine")+'</td></tr>'+
    row(t("Foreign ownership")+" "+foreignPct+"%",taxable)+
    row(t("Income tax at")+" "+rate+"%",tax,true)+
    '</table></div>');
  node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"تُفرض ضريبة الدخل في قطر على حصة الملكية الأجنبية من الربح. الشركة المملوكة بالكامل لقطريين معفاة لكنها تقدّم الإقرار. التسويات الضريبية — المصروفات غير المقبولة والإهلاك الضريبي والمخصصات — يحددها المحاسب القانوني، وهذه الشاشة تُظهر نقطة البداية فقط."
    :"Qatar charges income tax on the share of profit attributable to foreign ownership. A wholly Qatari-owned company is exempt but still files. The tax adjustments — disallowed expenses, tax depreciation, provisions — are your auditor's to determine. This screen shows the starting point, not the return.")+'</p>'));
  return sheet("Income Tax Workings",tp("forPeriod",fmtDate(from),fmtDate(to)),node);
}

/* ==================== THE THREE MISSING REPORTS ==================== */

/* What every subcontractor is owed, held from him, and committed to him. */
function repSubcontractors(){
  const rows=DB.suppliers.map(s=>{
    const payable=R2(-Ledger.bal(tagCode("ap"),{party:s.id}));
    const retention=R2(-Ledger.bal(tagCode("retention_pay"),{party:s.id}));
    const advance=R2(Ledger.bal(tagCode("supp_adv"),{party:s.id}));
    const pkgs=(DB.packages||[]).filter(p=>p.party===s.id&&p.status==="Awarded");
    const committed=R2(pkgs.reduce((a,p)=>a+R2(p.value-pkgCertified(p.id)),0));
    const back=R2((DB.backcharges||[]).filter(b=>b.party===s.id)
      .reduce((a,b)=>a+b.amount,0));
    return {s,payable,retention,advance,committed,back,
      exposure:R2(payable+retention+committed-advance)};
  }).filter(r=>r.payable||r.retention||r.committed||r.advance);
  const tot=k=>R2(rows.reduce((a,r)=>a+r[k],0));
  let html='<table><thead><tr>'+
    ['Subcontractor','Payable now','Retention held','Advance outstanding','Committed, uncertified',
     'Back-charged','Total exposure'].map((x,i)=>'<th'+(i?' class="num"':'')+'>'+esc(t(x))+'</th>').join("")+
    '</tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr><td>'+esc(r.s.name)+'</td><td class="num">'+money(r.payable)+
      '</td><td class="num">'+money(r.retention)+'</td><td class="num">'+money(r.advance)+
      '</td><td class="num">'+money(r.committed)+'</td><td class="num">'+
      (r.back?money(r.back):"—")+'</td><td class="num"><b>'+money(r.exposure)+'</b></td></tr>';
  });
  html+='<tr class="total"><td>'+esc(t("Total"))+'</td><td class="num">'+money(tot("payable"))+
    '</td><td class="num">'+money(tot("retention"))+'</td><td class="num">'+money(tot("advance"))+
    '</td><td class="num">'+money(tot("committed"))+'</td><td class="num">'+money(tot("back"))+
    '</td><td class="num">'+money(tot("exposure"))+'</td></tr></tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"التعرّض هو ما هو مستحق الآن، زائد ما هو محتجز وسيُستحق، زائد ما ارتُبط به ولم يُفوتر بعد، ناقص ما دُفع مقدماً."
    :"Exposure is what is owed now, plus what is held back and will fall due, plus what has been ordered and not yet invoiced, less what has been paid in advance.")+'</p>'));
  return sheet("Subcontractor Liability",tp("asAt",fmtDate(today())),node);
}

/* Overheads against what they were meant to run at. */
function repOverheadBudget(){
  const from=DB.settings.fyStart, to=today();
  const monthsElapsed=Math.max(1,Math.round(daysBetween(from,to)/30.44));
  const rows=postable().filter(a=>a.type==="EXPENSE"&&!["6800","6810"].includes(a.code))
    .map(a=>{
      const actual=R2(Ledger.show(a.code,{from,to}));
      const annual=+((DB.overheadBudget||{})[a.code])||0;
      const expected=R2(annual/12*monthsElapsed);
      return {a,actual,annual,expected,variance:R2(expected-actual)};
    }).filter(r=>r.actual||r.annual);
  const tot=k=>R2(rows.reduce((s,r)=>s+r[k],0));
  let html='<table><thead><tr>'+
    ['Account','Annual budget','Expected to date','Actual','Variance','Spent']
      .map((x,i)=>'<th'+(i?' class="num"':'')+'>'+esc(t(x))+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(r=>{
    const pct=r.annual?Math.round(r.actual/r.annual*1000)/10:null;
    html+='<tr><td><span class="code">'+esc(r.a.code)+'</span> '+esc(acctName(r.a.code))+
      '</td><td class="num">'+(r.annual?money(r.annual):"—")+'</td><td class="num">'+
      (r.annual?money(r.expected):"—")+'</td><td class="num">'+money(r.actual)+
      '</td><td class="num '+(r.annual&&r.variance<0?"neg":"pos")+'">'+
      (r.annual?money(r.variance):"—")+'</td><td class="num">'+(pct!=null?pct+"%":"—")+'</td></tr>';
  });
  html+='<tr class="total"><td>'+esc(t("Total"))+'</td><td class="num">'+money(tot("annual"))+
    '</td><td class="num">'+money(tot("expected"))+'</td><td class="num">'+money(tot("actual"))+
    '</td><td class="num '+(tot("variance")<0?"neg":"pos")+'">'+money(tot("variance"))+
    '</td><td></td></tr></tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"الميزانية السنوية تُدخل من إعدادات الشركة، والمتوقع حتى تاريخه هو حصة "+monthsElapsed+" شهراً منها."
    :"Annual budgets are set in Company Setup. Expected to date is "+monthsElapsed+" months' share of the year.")+'</p>'));
  return sheet("Overhead Budget",tp("forPeriod",fmtDate(from),fmtDate(to)),node);
}

/* Is the plant earning its keep? */
function repUtilisation(){
  const from=DB.settings.fyStart, to=today();
  const days=Math.max(1,daysBetween(from,to));
  const rows=(DB.assets||[]).filter(a=>
    ["Machinery & Heavy Equipment","Motor Vehicles","Tools & Small Plant"].includes(a.cat))
    .map(a=>{
      const logs=(DB.plantLogs||[]).filter(x=>x.asset===a.id);
      const used=R2(logs.reduce((s,x)=>s+(+x.days||0),0));
      const recovered=R2(logs.reduce((s,x)=>s+R2(x.days*x.rate),0));
      const depr=R2(Ledger.bal(tagCode("acc_depr"),{})&&0)||R2(a.cost/(a.life||5)/365*days);
      return {a,used,recovered,depr,
        util: Math.round(used/days*1000)/10,
        rate: used? R2(recovered/used) : 0,
        margin: R2(recovered-depr)};
    });
  const tot=k=>R2(rows.reduce((s,r)=>s+r[k],0));
  let html='<table><thead><tr>'+
    ['Equipment','Cost','Days on hire','Days available','Utilisation','Recovered',
     'Depreciation','Contribution'].map((x,i)=>'<th'+(i?' class="num"':'')+'>'+esc(t(x))+'</th>').join("")+
    '</tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr><td><span class="code">'+esc(r.a.tag)+'</span> '+esc(r.a.name)+
      '</td><td class="num">'+money(r.a.cost)+'</td><td class="num">'+money(r.used)+
      '</td><td class="num">'+days+'</td><td class="num'+(r.util<25?" neg":"")+'">'+r.util+
      '%</td><td class="num">'+money(r.recovered)+'</td><td class="num">'+money(r.depr)+
      '</td><td class="num '+(r.margin<0?"neg":"pos")+'">'+money(r.margin)+'</td></tr>';
  });
  html+='<tr class="total"><td>'+esc(t("Total"))+'</td><td class="num">'+
    money(R2(rows.reduce((s,r)=>s+r.a.cost,0)))+'</td><td class="num">'+money(tot("used"))+
    '</td><td></td><td></td><td class="num">'+money(tot("recovered"))+'</td><td class="num">'+
    money(tot("depr"))+'</td><td class="num '+(tot("margin")<0?"neg":"pos")+'">'+
    money(tot("margin"))+'</td></tr></tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  const idle=rows.filter(r=>r.util<25);
  if(idle.length) node.appendChild(h('<p style="margin-top:12px" class="neg">'+esc(isAR()
    ?idle.length+" معدة استُخدمت أقل من ربع الوقت: "+idle.map(r=>r.a.name).join("، ")
    :idle.length+" item"+(idle.length>1?"s were":" was")+" on hire less than a quarter of the time: "+
      idle.map(r=>r.a.name).join(", "))+'</p>'));
  node.appendChild(h('<p style="margin-top:6px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"المساهمة هي ما حُصِّل من المشاريع ناقص إهلاك الفترة. القيمة السالبة تعني أن استئجار المعدة كان سيكون أرخص من امتلاكها."
    :"Contribution is what was recovered from projects less the period's depreciation. A negative figure means hiring it would have been cheaper than owning it.")+'</p>'));
  return sheet("Equipment Utilisation",tp("forPeriod",fmtDate(from),fmtDate(to)),node);
}

/* ==================== E-INVOICING READINESS ====================
   Qatar has approved a draft law but published no schema. What can
   be done today is emit a structured invoice rather than a PDF, and
   hold a tax registration number against every party. */
function eInvoiceExport(j){
  const d=j.doc||{}; const party=DB.customers.find(c=>c.id===d.party)||{};
  const doc={
    documentType: d.type==="Contract certificate" ? "PaymentCertificate" : "TaxInvoice",
    documentNumber: d.no, issueDate: d.date, dueDate: d.due,
    currency: d.currency||"QAR", exchangeRate: d.fxRate||1,
    seller:{ name: DB.company.name, nameAr: DB.company.nameAr||null,
      commercialRegistration: DB.company.cr||null, taxRegistrationNumber: DB.company.trn||null,
      address: DB.company.addr||null },
    buyer:{ name: party.name||null, nameAr: party.nameAr||null,
      commercialRegistration: party.cr||null, taxRegistrationNumber: party.trn||null },
    project: d.project? {code:projCode(d.project),name:projName(d.project)} : null,
    lines: (d.lines&&d.lines.length)
      ? d.lines.map((l,i)=>{const it=DB.items.find(x=>x.id===l.item);
          return {lineNumber:i+1,description:it?it.name:(l.desc||""),
            quantity:+l.qty||0,unitPrice:+l.rate||0,
            lineTotal:R2((+l.qty||0)*(+l.rate||0)),taxRate:0,taxAmount:0};})
      : [{lineNumber:1,description:j.memo,quantity:1,unitPrice:d.gross,
          lineTotal:d.gross,taxRate:0,taxAmount:0}],
    totals:{ netAmount:d.gross, retention:d.retention||0,
      advanceRecovered:d.advance||0, taxAmount:0, amountDue:d.receivable },
    notes:"Prepared under Qatar's proposed e-invoicing framework. "+
      "No General Tax Authority schema has been published; field names follow common practice "+
      "and will be mapped when the technical specification is issued."
  };
  const b=document.createElement("div"); b.style.display="contents";
  b.appendChild(h('<div class="full"><p style="color:var(--ink-soft);font-size:12.5px;margin-bottom:8px">'+
    esc(isAR()
      ?"وافق مجلس الوزراء على مشروع قانون الفوترة الإلكترونية في ٦ مايو ٢٠٢٦، ولم تُنشر بعد المواصفات الفنية للهيئة العامة للضرائب. هذا التصدير يُظهر أن البيانات جاهزة بصيغة منظَّمة، وستُربط بالمواصفة عند صدورها."
      :"Qatar's Cabinet approved a draft e-invoicing law on 6 May 2026. The General Tax Authority has not published a technical schema. This export shows the data is ready in a structured form and will be mapped when the specification is issued.")+
    '</p><pre style="background:var(--field);border:1px solid var(--rule);border-radius:4px;padding:12px;font-size:11px;overflow:auto;max-height:340px;direction:ltr;text-align:left">'+
    esc(JSON.stringify(doc,null,2))+'</pre></div>'));
  modal({title:t("Structured invoice"),wide:true,body:b,buttons:[
    {label:isAR()?"تنزيل":"Download",fn:()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:"application/json"}));
      a.download=(d.no||"invoice")+".json"; document.body.appendChild(a); a.click(); a.remove();
      toast((d.no||"invoice")+".json"); }},
    {label:"Close",pri:true,fn:closeModal}]});
}
