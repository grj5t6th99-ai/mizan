function repTB(f,per){
  const rows=postable().map(a=>({a,b:Ledger.bal(a.code,f)})).filter(r=>Math.abs(r.b)>0.004);
  const dr=R2(rows.filter(r=>r.b>0).reduce((s,r)=>s+r.b,0)), cr=R2(rows.filter(r=>r.b<0).reduce((s,r)=>s-r.b,0));
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Account"))+'</th><th class="num">'+esc(t("Debit"))+'</th><th class="num">'+esc(t("Credit"))+'</th></tr></thead><tbody>';
  rows.forEach(r=>{ html+='<tr><td class="code">'+esc(r.a.code)+'</td><td>'+esc(acctName(r.a.code))+'</td><td class="num">'+
    (r.b>0?money(r.b):"")+'</td><td class="num">'+(r.b<0?money(-r.b):"")+'</td></tr>'; });
  html+='<tr class="total"><td colspan="2">'+esc(t("Total"))+'</td><td class="num">'+money(dr)+'</td><td class="num">'+money(cr)+'</td></tr>';
  html+='</tbody></table>';
  const node=h('<div>'+html+'</div>');
  if(Math.abs(R2(dr-cr))>0.004) node.appendChild(h('<p class="neg" style="margin-top:10px">'+esc(tp("outBy",qr(R2(dr-cr))))+'</p>'));
  return sheet("Trial Balance",per,node);
}

function repPL(f,per){
  const grp=t=>postable().filter(a=>a.type===t).map(a=>({a,v:Ledger.show(a.code,f)})).filter(r=>Math.abs(r.v)>0.004);
  const rev=grp("REVENUE"), cos=grp("COS"), exp=grp("EXPENSE");
  const tR=R2(rev.reduce((s,r)=>s+r.v,0)), tC=R2(cos.reduce((s,r)=>s+r.v,0)), tE=R2(exp.reduce((s,r)=>s+r.v,0));
  const gp=R2(tR-tC), np=R2(gp-tE);
  let html='<table><tbody>';
  const ln=r=>srow('<span class="code">'+esc(r.a.code)+'</span> '+esc(acctName(r.a.code)),r.v,"",true);
  html+='<tr class="head"><td colspan="2">'+esc(t("Revenue"))+'</td></tr>'+rev.map(ln).join("");
  html+=srow(t("Total revenue"),tR,"sub");
  html+='<tr class="head"><td colspan="2">'+esc(t("Cost of sales and direct costs"))+'</td></tr>'+cos.map(ln).join("");
  html+=srow(t("Total direct cost"),tC,"sub");
  html+=srow("<b>"+esc(t("Gross profit"))+"</b>",gp,"sub");
  html+='<tr class="head"><td colspan="2">'+esc(t("General and administrative expenses"))+'</td></tr>'+exp.map(ln).join("");
  html+=srow(t("Total operating expenses"),tE,"sub");
  html+=srow("<b>"+esc(t("Net profit for the period"))+"</b>",np,"total");
  html+='</tbody></table>';
  const node=h('<div>'+html+'</div>');
  if(tR) node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">Gross margin '+Math.round(gp/tR*100)+'% · net margin '+Math.round(np/tR*100)+'%'+(f.project?' · filtered to '+esc(projName(f.project)):"")+'</p>'));
  return sheet("Statement of Profit or Loss",per,node);
}

function repBS(to){
  const f={to};
  const pick=(pred)=>postable().filter(pred).map(a=>({a,v:Ledger.show(a.code,f)})).filter(r=>Math.abs(r.v)>0.004);
  const ca=pick(a=>a.type==="ASSET"&&a.code<"1200"), nca=pick(a=>a.type==="ASSET"&&a.code>="1200");
  const cl=pick(a=>a.type==="LIABILITY"&&a.code<"2200"), ncl=pick(a=>a.type==="LIABILITY"&&a.code>="2200");
  const eq=pick(a=>a.type==="EQUITY");
  const tCA=R2(ca.reduce((s,r)=>s+r.v,0)), tNCA=R2(nca.reduce((s,r)=>s+r.v,0));
  const tCL=R2(cl.reduce((s,r)=>s+r.v,0)), tNCL=R2(ncl.reduce((s,r)=>s+r.v,0));
  const np=Ledger.netProfit(f), tEQ=R2(eq.reduce((s,r)=>s+r.v,0)+np);
  const line=r=>srow('<span class="code">'+esc(r.a.code)+'</span> '+esc(acctName(r.a.code)),r.v,"",true);
  const head=k=>'<tr class="head"><td colspan="2">'+esc(t(k))+'</td></tr>';
  let html='<table><tbody>';
  html+=head("Current assets")+ca.map(line).join("")+srow(t("Total current assets"),tCA,"sub");
  html+=head("Non-current assets")+nca.map(line).join("")+srow(t("Total non-current assets"),tNCA,"sub");
  html+=srow("<b>"+esc(t("Total assets"))+"</b>",R2(tCA+tNCA),"total");
  html+=head("Current liabilities")+cl.map(line).join("")+srow(t("Total current liabilities"),tCL,"sub");
  html+=head("Non-current liabilities")+ncl.map(line).join("")+srow(t("Total non-current liabilities"),tNCL,"sub");
  html+=head("Owner\u2019s equity")+eq.map(line).join("")+
        srow(t("Profit for the period"),np,"",true)+srow(t("Total equity"),tEQ,"sub");
  html+=srow("<b>"+esc(t("Total liabilities and equity"))+"</b>",R2(tCL+tNCL+tEQ),"total");
  html+='</tbody></table>';
  const node=h('<div>'+html+'</div>');
  const diff=R2((tCA+tNCA)-(tCL+tNCL+tEQ));
  node.appendChild(h('<p style="margin-top:12px" class="'+(Math.abs(diff)>0.004?"neg":"pos")+'">'+
    (Math.abs(diff)>0.004?esc(tp("outBy",qr(diff))):esc(t("Balance sheet agrees.")))+'</p>'));
  return sheet("Statement of Financial Position",tp("asAt",fmtDate(to)),node);
}

function repGL(code,f,per){
  const rows=Ledger.rows(code,f), open=R2(Ledger.bal(code,{to:addDays(f.from,-1)}));
  let html='<table><thead><tr><th>'+esc(t("Date"))+'</th><th>'+esc(t("Voucher"))+'</th><th>'+esc(t("Source"))+'</th><th>'+esc(t("Narration"))+'</th><th class="num">'+esc(t("Debit"))+'</th><th class="num">'+esc(t("Credit"))+'</th><th class="num">'+esc(t("Balance"))+'</th></tr></thead><tbody>';
  html+='<tr><td colspan="6"><b>'+esc(t("Opening balance"))+'</b></td><td class="num"><b>'+money(open)+'</b></td></tr>';
  let run=open;
  rows.forEach(r=>{ run=R2(run+r.dr-r.cr);
    html+='<tr><td>'+fmtDate(r.date)+'</td><td class="code">'+esc(r.no)+'</td><td>'+esc(t(r.source))+'</td><td>'+esc(r.memo)+
      '</td><td class="num">'+(r.dr?money(r.dr):"")+'</td><td class="num">'+(r.cr?money(r.cr):"")+'</td><td class="num">'+money(run)+'</td></tr>'; });
  html+='<tr class="total"><td colspan="4">'+esc(t("Closing balance"))+'</td><td class="num">'+money(R2(rows.reduce((s,r)=>s+r.dr,0)))+
    '</td><td class="num">'+money(R2(rows.reduce((s,r)=>s+r.cr,0)))+'</td><td class="num">'+money(run)+'</td></tr></tbody></table>';
  return sheet("General Ledger — "+code+" "+acctName(code),per,h('<div class="scroll">'+html+'</div>'));
}

function repCB(f,per){
  const accts=DB.accounts.filter(a=>a.tag==="cash"||a.tag==="bank");
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Account"))+'</th><th>'+esc(t("Type"))+'</th><th class="num">'+esc(t("Opening"))+'</th><th class="num">'+esc(t("Received"))+'</th><th class="num">'+esc(t("Paid"))+'</th><th class="num">'+esc(t("Closing"))+'</th></tr></thead><tbody>';
  let tc=0;
  accts.forEach(a=>{
    const open=Ledger.bal(a.code,{to:addDays(f.from,-1)}), rows=Ledger.rows(a.code,f);
    const dr=R2(rows.reduce((s,r)=>s+r.dr,0)), cr=R2(rows.reduce((s,r)=>s+r.cr,0)), close=R2(open+dr-cr);
    tc=R2(tc+close);
    html+='<tr><td class="code">'+esc(a.code)+'</td><td>'+esc(acctName(a.code))+'</td><td>'+esc(t(a.tag==="bank"?"Bank":"Cash"))+
      '</td><td class="num">'+money(open)+'</td><td class="num">'+money(dr)+'</td><td class="num">'+money(cr)+
      '</td><td class="num"><b>'+money(close)+'</b></td></tr>';
  });
  html+='<tr class="total"><td colspan="6">'+esc(t("Total cash and bank balances"))+'</td><td class="num">'+money(tc)+'</td></tr></tbody></table>';
  return sheet("Cash & Bank Summary",per,h('<div class="scroll">'+html+'</div>'));
}

function repInv(per){
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Description"))+'</th><th>'+esc(t("Unit"))+'</th><th class="num">'+esc(t("Qty"))+'</th><th class="num">'+esc(t("Avg cost"))+'</th><th class="num">'+esc(t("Value"))+'</th><th class="num">'+esc(t("Sell price"))+'</th><th class="num">'+esc(t("Margin"))+' %</th></tr></thead><tbody>';
  DB.items.forEach(i=>{
    const marg=i.price?Math.round((i.price-i.cost)/i.price*100):0;
    html+='<tr><td class="code">'+esc(i.code)+'</td><td>'+esc(i.name)+'</td><td>'+esc(t(i.unit))+
      '</td><td class="num">'+money(i.qty)+'</td><td class="num">'+money(i.cost)+'</td><td class="num">'+money(R2(i.qty*i.cost))+
      '</td><td class="num">'+money(i.price)+'</td><td class="num">'+marg+'%</td></tr>';
  });
  html+='<tr class="total"><td colspan="5">'+esc(t("Total stock at weighted-average cost"))+'</td><td class="num">'+money(stockValue())+'</td><td colspan="2"></td></tr></tbody></table>';
  return sheet("Inventory Valuation",per,h('<div class="scroll">'+html+'</div>'));
}

function repExp(f,per){
  const rows=postable().filter(a=>a.type==="EXPENSE"||a.type==="COS").map(a=>({a,v:Ledger.show(a.code,f)})).filter(r=>Math.abs(r.v)>0.004)
    .sort((x,y)=>y.v-x.v);
  const tot=R2(rows.reduce((s,r)=>s+r.v,0));
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Expense"))+'</th><th>'+esc(t("Class"))+'</th><th class="num">'+esc(t("Amount"))+'</th><th class="num">'+esc(t("% of total"))+'</th></tr></thead><tbody>';
  rows.forEach(r=>html+='<tr><td class="code">'+esc(r.a.code)+'</td><td>'+esc(acctName(r.a.code))+'</td><td>'+
    esc(t(r.a.type==="COS"?"Direct cost":"Overhead"))+'</td><td class="num">'+money(r.v)+'</td><td class="num">'+(tot?Math.round(r.v/tot*100):0)+'%</td></tr>');
  html+='<tr class="total"><td colspan="3">'+esc(t("Total cost and expenses"))+'</td><td class="num">'+money(tot)+'</td><td class="num">100%</td></tr></tbody></table>';
  return sheet("Expense Analysis",per,h('<div class="scroll">'+html+'</div>'));
}

function repProj(per){
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Project"))+'</th><th>'+esc(t("Client"))+'</th><th class="num">'+esc(t("Contract value"))+'</th><th class="num">'+esc(t("Certified"))+'</th><th class="num">'+esc(t("Cost"))+'</th><th class="num">'+esc(t("Margin"))+'</th><th class="num">%</th><th>'+esc(t("Schedule"))+'</th></tr></thead><tbody>';
  let tv=0,tr=0,tc=0;
  DB.projects.forEach(p=>{
    const r=projRevenue(p.id), c=projCost(p.id), mg=R2(r-c), fl=projFlag(p);
    tv=R2(tv+p.value); tr=R2(tr+r); tc=R2(tc+c);
    html+='<tr><td class="code">'+esc(p.code)+'</td><td>'+esc(p.name)+'</td><td>'+esc(custName(p.customer))+
      '</td><td class="num">'+money(p.value)+'</td><td class="num">'+money(r)+'</td><td class="num">'+money(c)+
      '</td><td class="num '+(mg<0?"neg":"")+'">'+money(mg)+'</td><td class="num">'+(r?Math.round(mg/r*100):0)+
      '%</td><td>'+(fl.late?'<span class="tag red">'+esc(tp("daysOverdue",fl.over))+'</span>':fl.done?'<span class="tag green">'+esc(t(p.status))+'</span>':'<span class="tag">'+esc(t("On schedule"))+'</span>')+'</td></tr>';
  });
  html+='<tr class="total"><td colspan="3">'+esc(t("Total"))+'</td><td class="num">'+money(tv)+'</td><td class="num">'+money(tr)+
    '</td><td class="num">'+money(tc)+'</td><td class="num">'+money(R2(tr-tc))+'</td><td class="num">'+(tr?Math.round((tr-tc)/tr*100):0)+'%</td><td></td></tr></tbody></table>';
  return sheet("Project Profitability",per,h('<div class="scroll">'+html+'</div>'));
}

function repSched(){
  const rows=DB.projects.slice().sort((a,b)=>projFlag(b).over-projFlag(a).over);
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Project"))+'</th><th>'+esc(t("Client"))+'</th>'+
    '<th>'+esc(t("Project manager"))+'</th><th>'+esc(t("Start"))+'</th><th>'+esc(t("Original end date"))+'</th>'+
    '<th>'+esc(t("Current end date"))+'</th><th class="num">'+esc(t("Slip"))+'</th><th class="num">'+esc(t("Revisions"))+'</th>'+
    '<th class="num">'+esc(t("Days over"))+'</th><th>'+esc(t("Status"))+'</th></tr></thead><tbody>';
  rows.forEach(p=>{
    const f=projFlag(p), base=p.baselineEnd||p.end, slip=daysBetween(base,p.end);
    html+='<tr'+(f.late?' style="background:var(--maroon-soft)"':'')+'><td class="code">'+esc(p.code)+'</td><td>'+
      (f.late?'<span class="flagdot"></span>':'')+esc(p.name)+'</td><td>'+esc(custName(p.customer))+'</td><td>'+
      esc(p.manager||"—")+'</td><td>'+fmtDate(p.start)+'</td><td>'+fmtDate(base)+'</td><td><b>'+fmtDate(p.end)+
      '</b></td><td class="num'+(slip>0?" neg":"")+'">'+(slip>0?"+"+slip:slip||"—")+'</td><td class="num">'+
      ((p.revisions||[]).length||"—")+'</td><td class="num'+(f.late?" neg":"")+'"><b>'+(f.late?f.over:(f.done?"—":0))+
      '</b></td><td>'+(f.late?'<span class="tag red">'+esc(t("Overdue"))+'</span>':f.done?'<span class="tag green">'+
      esc(t(p.status))+'</span>':'<span class="tag">'+esc(t("On schedule"))+'</span>')+'</td></tr>';
  });
  html+='</tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  const late=lateProjects().length;
  node.appendChild(h('<p style="margin-top:12px" class="'+(late?"neg":"pos")+'">'+
    (late?esc(tp("projOverdue",late)):esc(t("No overdue projects")))+'</p>'));
  return sheet("Schedule Watch",tp("asAt",fmtDate(today())),node);
}

function demoPost(){
  const P=(date,source,memo,lines,extra)=>Ledger.post(Object.assign({no:nextNo(source==="Sales Invoice"?"SI":source==="Purchase Invoice"?"PI":source==="Receipt"?"RV":source==="Payment"?"PV":"JV"),
    date,source,memo,lines},extra||{}));
  const M=n=>"2026-"+String(n).padStart(2,"0");

  /* opening position */
  P(M(1)+"-01","Journal","Opening balances brought forward",[
    {account:"1120",dr:2800000,cr:0},{account:"1121",dr:450000,cr:0},
    {account:"1110",dr:25000,cr:0},{account:"1111",dr:8000,cr:0},
    {account:"3100",dr:0,cr:2000000},{account:"3300",dr:0,cr:1283000}]);

  /* fixed assets */
  [["Toyota Hilux Double Cab — plate 447821","Motor Vehicles","2026-01-10",96000,5,10000],
   ["Nissan Urvan Crew Bus — plate 331902","Motor Vehicles","2026-01-10",78000,5,8000],
   ["JCB 3CX Backhoe Loader","Machinery & Heavy Equipment","2026-02-05",340000,8,40000],
   ["Office workstations & meeting room","Furniture & Fixtures","2026-01-15",64000,5,0],
   ["Dell laptops, server & network rack","Office & IT Equipment","2026-01-20",52000,4,0],
   ["Core drilling & cable pulling tool set","Tools & Small Plant","2026-03-01",28000,3,0]
  ].forEach((a,i)=>{
    const tag="FA-"+String(DB.assets.length+1).padStart(4,"0"), aid="A"+Date.now()+"-"+i;
    DB.assets.push({id:aid,tag,name:a[0],cat:a[1],serial:"",date:a[2],cost:a[3],residual:a[5],
      life:a[4],custodian:"Head office",deprTo:"",status:"In use"});
    P(a[2],"Asset Acquisition","Acquisition of "+a[0]+" ("+tag+")",[
      {account:tagCode("fa:"+a[1]),dr:a[3],cr:0,party:aid},{account:"1120",dr:0,cr:a[3]}]);
  });

  /* goods received */
  [[M(1)+"-18","S001","PI-REF-3391",[["IT05",22,2280],["IT03",180,168]]],
   [M(2)+"-06","S002","AJ-8842",[["IT01",4200,29.4],["IT02",34,505],["IT06",18,1890]]],
   [M(3)+"-12","S003","EC-1120",[["IT04",1400,13.2]]],
   [M(5)+"-09","S002","AJ-9107",[["IT01",2600,30.8],["IT02",22,512]]],
   [M(6)+"-21","S001","PI-REF-3688",[["IT05",14,2410]]]
  ].forEach(g=>{
    const no=nextNo("PI"), sup=DB.suppliers.find(s=>s.id===g[1]);
    const byAcct={}; let tot=0;
    g[3].forEach(l=>{ const it=DB.items.find(x=>x.id===l[0]); const val=R2(l[1]*l[2]);
      byAcct[it.acct]=R2((byAcct[it.acct]||0)+val); tot=R2(tot+val); });
    const lines=Object.keys(byAcct).map(a=>({account:a,dr:byAcct[a],cr:0,memo:"Goods received"}));
    lines.push({account:"2110",dr:0,cr:tot,party:g[1],memo:"Supplier invoice "+g[2]});
    Ledger.post({no,date:g[0],source:"Purchase Invoice",memo:"Goods for stock — "+sup.name,lines,
      doc:{no,date:g[0],due:addDays(g[0],sup.terms),party:g[1],type:"Goods for stock",ref:g[2],project:"",gross:tot,retention:0,receivable:tot}});
    g[3].forEach(l=>moveStock(l[0],l[1],l[2],"GRN "+no,g[0],""));
  });

  /* trading sales */
  [[M(2)+"-11","C003",[["IT01",850,38.5],["IT02",6,640]]],
   [M(3)+"-04","C004",[["IT06",5,2380],["IT03",40,210]]],
   [M(4)+"-19","C003",[["IT04",600,16.75],["IT05",6,2650]]],
   [M(6)+"-08","C004",[["IT01",1100,38.5]]],
   [M(7)+"-15","C003",[["IT02",9,640],["IT06",4,2380]]]
  ].forEach(s=>{
    const no=nextNo("SI"), cust=DB.customers.find(c=>c.id===s[1]);
    let tot=0, cogs=0; const byAcct={};
    s[2].forEach(l=>{ const it=DB.items.find(x=>x.id===l[0]); tot=R2(tot+l[1]*l[2]);
      const c=R2(l[1]*it.cost); cogs=R2(cogs+c); byAcct[it.acct]=R2((byAcct[it.acct]||0)+c); });
    const lines=[{account:"1130",dr:tot,cr:0,party:s[1],memo:"Invoice value"},{account:"4100",dr:0,cr:tot,memo:"Trading sales"}];
    if(cogs){ lines.push({account:"5100",dr:cogs,cr:0,memo:"Cost of goods sold"});
      Object.keys(byAcct).forEach(a=>lines.push({account:a,dr:0,cr:byAcct[a],memo:"Stock relieved"})); }
    Ledger.post({no,date:s[0],source:"Sales Invoice",memo:"Trading invoice to "+cust.name,lines,
      doc:{no,date:s[0],due:addDays(s[0],cust.terms),party:s[1],type:"Trading invoice",project:"",gross:tot,retention:0,receivable:tot,lines:[]}});
    s[2].forEach(l=>moveStock(l[0],-l[1],0,"Sale "+no,s[0],""));
  });

  /* ---- estimating: a won tender that became PRJ-2601, one live,
         one lost, plus the cost codes and packages that show a job
         drifting over budget while it is still running ---- */
  const boq = [
    ["Electrical","E-100","LV distribution boards and sub-mains","NOS",48,6400,900,0,0,150],
    ["Electrical","E-200","Containment, cabling and final fix","MTR",16800,31.5,9.25,0,0,0],
    ["HVAC","H-100","Ductwork supply and installation","M2",7200,0,0,0,210,0],
    ["HVAC","H-200","Chilled water pipework and insulation","MTR",3800,88,34,6,0,0],
    ["Plumbing","P-100","Sanitary fit-out and drainage","NOS",184,1250,380,0,0,0]
  ].map(x=>({section:x[0],code:x[1],desc:x[2],unit:x[3],qty:x[4],
             material:x[5],labour:x[6],plant:x[7],subcontract:x[8],other:x[9]}));

  DB.estimates=[
    {id:"E1",ref:"EST-2601",title:"Lusail Marina Tower — MEP Fit-Out",customer:"C001",
     date:M(1)+"-08",submitted:M(1)+"-12",decided:M(1)+"-22",status:"Won",project:"P001",
     contingencyPct:2,overheadPct:8,profitPct:12,durationDays:320,retentionPct:10,lines:boq},
    {id:"E2",ref:"EST-2602",title:"Al Wakrah Clinic — MEP and finishes",customer:"C002",
     date:M(6)+"-14",submitted:M(6)+"-20",status:"Submitted",project:"",
     contingencyPct:2,overheadPct:8,profitPct:14,durationDays:180,retentionPct:10,
     lines:[{section:"MEP",code:"0010",desc:"Mechanical and electrical package",unit:"SUM",qty:1,
             material:410000,labour:185000,plant:24000,subcontract:260000,other:31000},
            {section:"Finishes",code:"0020",desc:"Internal finishes",unit:"M2",qty:2400,
             material:118,labour:64,plant:0,subcontract:0,other:0}]},
    {id:"E3",ref:"EST-2603",title:"Industrial Area warehouse — civil works",customer:"C003",
     date:M(4)+"-03",submitted:M(4)+"-09",decided:M(5)+"-02",status:"Lost",project:"",
     outcome:"Price — above the winning bid by about 9%",
     contingencyPct:2,overheadPct:8,profitPct:12,durationDays:150,retentionPct:5,
     lines:[{section:"Civil",code:"0010",desc:"Slab, drainage and loading bays",unit:"SUM",qty:1,
             material:295000,labour:140000,plant:78000,subcontract:0,other:22000}]}
  ];

  /* the won estimate becomes the budget for PRJ-2601 */
  DB.costCodes = boq.map((l,i)=>({
    id:"CC"+(i+1), project:"P001", code:l.code, section:l.section, desc:l.desc, unit:l.unit, qty:l.qty,
    budget:{material:R2(l.qty*l.material),labour:R2(l.qty*l.labour),plant:R2(l.qty*l.plant),
            subcontract:R2(l.qty*l.subcontract),other:R2(l.qty*l.other)},
    sell:R2(l.qty*(l.material+l.labour+l.plant+l.subcontract+l.other)*1.02*1.08*1.12)}));

  /* ductwork ordered ABOVE the priced rate: the overrun exists from
     the day of the order, months before the final invoice */
  DB.packages=[{id:"SC1",ref:"SC-101",project:"P001",party:"S004",
    title:"Ductwork supply and installation",costCode:"CC3",value:1608000,
    retentionPct:10,status:"Awarded",date:M(2)+"-15"}];

  DB.variations=[{id:"VO1",ref:"VO-101",project:"P001",
    title:"Additional distribution boards to levels 18-22",
    sell:52000,cost:38000,days:0,status:"Approved",date:M(5)+"-06"}];
  DB.costCodes.push({id:"CC6",project:"P001",code:"VO-101",section:"Variations",
    desc:"Additional distribution boards to levels 18-22",unit:"SUM",qty:1,
    budget:{material:0,labour:0,plant:0,subcontract:0,other:38000},sell:52000});
  const p1=DB.projects.find(x=>x.id==="P001");
  if(p1){
    /* the contract is worth what it was priced at, plus the approved
       variation; anything else and value of work done cannot be
       compared with what has been certified */
    p1.value=R2(DB.costCodes.reduce((s2,c)=>s2+(+c.sell||0),0));
  }

  /* procurement: one order fully received and matched, one part
     received and awaiting its invoice, one requisition still waiting
     for somebody to approve it */
  DB.requisitions=[
    {id:"RQ1",ref:"REQ-101",date:M(5)+"-04",needed:M(5)+"-20",project:"P001",by:"Eng. Yousef Baloch",
     status:"Ordered",order:"PO-101",lines:[{item:"IT06",desc:"",qty:12,rate:1890}]},
    {id:"RQ2",ref:"REQ-102",date:M(7)+"-02",needed:M(7)+"-25",project:"P002",by:"Eng. Rania Haddad",
     status:"Draft",lines:[{item:"IT02",desc:"",qty:14,rate:512},{item:"IT01",desc:"",qty:900,rate:31.5}]}
  ];
  DB.orders=[
    {id:"PO1",ref:"PO-101",party:"S002",date:M(5)+"-06",delivery:M(5)+"-20",project:"P001",
     costCode:"CC1",terms:"Delivered to site",status:"Closed",requisition:"RQ1",
     lines:[{item:"IT06",desc:"",qty:12,rate:1890}]},
    {id:"PO2",ref:"PO-102",party:"S001",date:M(7)+"-08",delivery:M(8)+"-05",project:"P001",
     costCode:"CC4",terms:"CIF Doha",status:"Part received",
     lines:[{item:"IT03",desc:"",qty:240,rate:168},{item:"IT05",desc:"",qty:18,rate:2410}]}
  ];
  DB.grns=[
    {id:"GR1",ref:"GRN-101",order:"PO1",party:"S002",date:M(5)+"-19",dn:"AJ-DN-9910",
     landed:0,lines:[{item:"IT06",desc:"",qty:12,rate:1890}]},
    {id:"GR2",ref:"GRN-102",order:"PO2",party:"S001",date:M(8)+"-02",dn:"QS-DN-4471",
     landed:11400,lines:[{item:"IT03",desc:"",qty:240,rate:168}]}
  ];

  /* Post the receipts properly: stock in, landed cost spread, and the
     liability recognised on delivery rather than on invoice. Seeding
     these as bare records would leave the register saying one thing
     and the ledger another. */
  DB.grns.forEach(g=>{
    const o=DB.orders.find(x=>x.id===g.order);
    const byAcct={}; let val=0;
    g.lines.forEach(l=>{ const it=DB.items.find(x=>x.id===l.item);
      const v=R2(l.qty*l.rate); byAcct[it.acct]=R2((byAcct[it.acct]||0)+v); val=R2(val+v); });
    const lines=Object.keys(byAcct).map(a=>({account:a,dr:byAcct[a],cr:0,
      project:o.project,costCode:o.costCode,memo:"Goods received"}));
    if(g.landed){
      lines.push({account:Object.keys(byAcct)[0],dr:g.landed,cr:0,project:o.project,
        costCode:o.costCode,memo:"Freight, duty and clearing"});
      lines.push({account:"2110",dr:0,cr:g.landed,party:o.party,memo:"Clearing agent"});
    }
    lines.push({account:"2121",dr:0,cr:val,party:g.party,memo:"Goods received not invoiced"});
    const e=Ledger.post({no:g.ref,date:g.date,source:"Goods Received",project:o.project,
      memo:"Goods received — "+o.ref+" · DN "+g.dn,lines,doc:{no:g.ref,grnOf:o.id}});
    g.entry=e.id;
    g.lines.forEach(l=>moveStock(l.item,l.qty,l.rate,g.ref,g.date,o.project,e.id));
    if(g.landed) spreadLandedCost(g.lines,g.landed,g.ref,g.date);
  });

  /* the first order's invoice arrived and matched; the second has not */
  (function(){
    const g=DB.grns[0], o=DB.orders.find(x=>x.id===g.order);
    const val=R2(g.lines.reduce((s2,l)=>s2+R2(l.qty*l.rate),0));
    const date=M(5)+"-27", no=nextNo("PI");
    Ledger.post({no,date,source:"Purchase Invoice",project:o.project,
      memo:"Supplier invoice AJ-INV-2214 matched to "+g.ref,
      lines:[{account:"2121",dr:val,cr:0,party:g.party,memo:"Clearing goods received"},
             {account:"2110",dr:0,cr:val,party:g.party,memo:"Supplier invoice AJ-INV-2214"}],
      doc:{no,date,due:addDays(date,30),party:g.party,type:"Goods for stock",ref:"AJ-INV-2214",
        project:o.project,grn:g.id,order:o.id,gross:val,retention:0,receivable:val}});
  })();

  /* documents that stop work when they lapse; the dates are spread
     either side of today so the register has something to say */
  const dd=n=>addDays(today(),n);
  DB.docs=[
    ["EMPLOYEE","QID","E001","28712345678",-400,330],["EMPLOYEE","VISA","E001","QA-119284",-400,330],
    ["EMPLOYEE","QID","E002","29034567811",-330,18],  ["EMPLOYEE","HEALTH","E002","HC-44219",-330,18],
    ["EMPLOYEE","QID","E003","28556677889",-200,165], ["EMPLOYEE","PASSPORT","E003","N4482910",-900,540],
    ["EMPLOYEE","QID","E004","29122334455",-360,-12], ["EMPLOYEE","LICENCE","E004","DL-772103",-500,220],
    ["EMPLOYEE","QID","E005","29566778811",-300,62],  ["EMPLOYEE","CONTRACT","E005","LC-2024-118",-700,400],
    ["COMPANY","CR","","84512",-320,44],              ["COMPANY","TRADE","","TL-99120",-320,44],
    ["COMPANY","COMPUTER","","CC-51043",-300,80],     ["COMPANY","CHAMBER","","QC-22841",-330,35],
    ["VEHICLE","ISTIMARA","447821 — Toyota Hilux","IST-447821",-300,71],
    ["VEHICLE","INSURANCE","447821 — Toyota Hilux","POL-88231",-300,71],
    ["VEHICLE","ISTIMARA","331902 — Nissan Urvan","IST-331902",-340,-6],
    ["VEHICLE","INSPECTION","331902 — Nissan Urvan","TI-33190",-340,25]
  ].map((x,i)=>({id:"D"+i,kind:x[0],type:x[1],holder:x[2],number:x[3],
                 issued:dd(x[4]),expires:dd(x[5]),note:""}));

  DB.guarantees=[
    {id:"G1",ref:"BG-101",type:"APG",party:"C001",project:"P001",bank:"QNB",
     number:"QNB/APG/26/4471",value:420000,commissionPct:1,issued:dd(-220),expires:dd(96),status:"Active"},
    {id:"G2",ref:"BG-102",type:"PERF",party:"C001",project:"P001",bank:"QNB",
     number:"QNB/PB/26/4472",value:420000,commissionPct:1.25,issued:dd(-220),expires:dd(210),status:"Active"},
    {id:"G3",ref:"BG-103",type:"PERF",party:"C002",project:"P002",bank:"Commercial Bank",
     number:"CBQ/PB/26/1180",value:165000,commissionPct:1.25,issued:dd(-190),expires:dd(22),status:"Active"},
    {id:"G4",ref:"BG-104",type:"TENDER",party:"C003",project:"",bank:"Doha Bank",
     number:"DB/TB/26/0912",value:44000,commissionPct:0.75,issued:dd(-140),expires:dd(-9),status:"Active"}
  ];

  /* progress measured against the bill of quantities, so the
     certificates raised below are a consequence of the work rather
     than a number somebody chose */
  DB.valuations=[];
  const measure=(date,pcts)=>{
    const lines=Object.keys(pcts).map(k=>({costCode:k,pct:pcts[k]}));
    const val=R2(lines.reduce((s,l)=>{const c=DB.costCodes.find(x=>x.id===l.costCode);
      return c? s+R2((+c.sell||0)*l.pct/100) : s;},0));
    const before=R2(DB.valuations.reduce((s,v)=>Math.max(s,v.valueToDate),0));
    DB.valuations.push({id:"VAL"+date,ref:"IPC-"+(DB.valuations.length+1),project:"P001",
      date,status:"Certified",lines,valueToDate:val,previous:before,thisPeriod:R2(val-before)});
    return R2(val-before);
  };
  measure(M(3)+"-25",{CC1:35,CC2:60,CC3:30,CC4:20,CC5:0,CC6:0});
  measure(M(6)+"-25",{CC1:55,CC2:85,CC3:48,CC4:45,CC5:15,CC6:100});

  /* advance payments received from clients against bank guarantees,
     posted before the first certificate that recovers them */
  [["P001","C001",1,"18",420000,"APG-QNB-2601"],["P003","C003",3,"16",88000,"APG-CBQ-2603"]].forEach(a=>{
    const date=M(a[2])+"-"+a[3], no=nextNo("RV");
    Ledger.post({no,date,source:"Advance Received",project:a[0],
      memo:"Advance received from "+custName(a[1])+" — "+projCode(a[0])+" · "+a[5],
      lines:[{account:"1120",dr:a[4],cr:0,party:a[1],project:a[0],memo:"Advance received"},
             {account:"2130",dr:0,cr:a[4],party:a[1],project:a[0],memo:"Advance from "+custName(a[1])+" · "+a[5]}],
      doc:{no,party:a[1],into:"1120",mode:"Advance",ref:a[5]}});

      DB.costCodes.push(c); return c;
    });
    const proj=DB.projects.find(x=>x.id===pid);
    if(proj) proj.value=R2(codes.reduce((a,c)=>a+c.sell,0));

    /* real costs against those codes, so budget versus actual means

    costs.forEach(x=>{
      const cc=codes[x[0]], amt=x[2], date=x[3];
      Ledger.post({no:nextNo("PI"),date,source:"Purchase Invoice",project:pid,
        memo:x[4],
        lines:[{account:x[1],dr:amt,cr:0,project:pid,costCode:cc.id,memo:x[4]},

          project:pid,gross:amt,retention:0,advance:0,receivable:amt}});

    /* measure the work, and certify what the measurement says */
    const lines=codes.map((c,i)=>({costCode:c.id,pct:pcts[i]||0}));

       raised the certificate, so every one of these jobs carried its
       costs with no revenue against them and the company showed a
       loss it had not made. */
    const ipc=nextNo("IPC");

      status:"Certified",lines,valueToDate:val,previous:0,thisPeriod:val});
    return codes;

async function boot(){

  DB.stockMoves=DB.stockMoves||[]; DB.assets=DB.assets||[]; DB.journals=DB.journals||[];
  DB.items.forEach(i=>{ if(i.val==null) i.val=R2(i.qty*i.cost); });
  /* schedule baseline: every contract keeps its original end date and a revision log */
  DB.projects.forEach(p=>{ if(!p.baselineEnd) p.baselineEnd=p.end; if(!p.revisions) p.revisions=[]; });
  DB.estimates=DB.estimates||[]; DB.costCodes=DB.costCodes||[];
  DB.packages=DB.packages||[]; DB.variations=DB.variations||[]; DB.valuations=DB.valuations||[];
  DB.docs=DB.docs||[]; DB.guarantees=DB.guarantees||[];
  DB.requisitions=DB.requisitions||[]; DB.orders=DB.orders||[];
  DB.timesheets=DB.timesheets||[]; DB.plantLogs=DB.plantLogs||[];
  DB.backcharges=DB.backcharges||[]; DB.issues=DB.issues||[]; DB.dayworks=DB.dayworks||[];
  DB.reconciled=DB.reconciled||{}; DB.recStatements=DB.recStatements||{};
  DB.lcs=DB.lcs||[]; DB.priceLists=DB.priceLists||[];
  DB.milestones=DB.milestones||[]; DB.pqDocs=DB.pqDocs||[]; DB.pqSubmissions=DB.pqSubmissions||[];
  DB.stockCounts=DB.stockCounts||[]; DB.batches=DB.batches||[];
  DB.overheadBudget=DB.overheadBudget||{};
  if(DB.settings.foreignOwnershipPct==null) DB.settings.foreignOwnershipPct=0;
  if(DB.settings.taxRatePct==null) DB.settings.taxRatePct=10;
  if(!DB.company.trn) DB.company.trn="";
  DB.customers.forEach(c=>{ if(c.trn==null) c.trn=""; });
  DB.suppliers.forEach(c=>{ if(c.trn==null) c.trn=""; });
  DB.attachments=DB.attachments||[]; DB.outbox=DB.outbox||[]; DB.fxRates=DB.fxRates||{};
  DB.employees.forEach(e=>{ if(e.ticket==null) e.ticket=1800; });
  DB.grns=DB.grns||[]; DB.deliveries=DB.deliveries||[];
  /* a shared link can preselect language and landing screen:
     .../mizan/?lang=ar        opens in Arabic
     .../mizan/?view=projects  opens on a given module
     .../mizan/?tour=0         skips the welcome guide            */
  let q={}; try{ q=Object.fromEntries(new URLSearchParams(location.search)); }catch(e){}
  if(q.lang==="ar"||q.lang==="en") DB.settings.lang=q.lang;
  LANG = DB.settings.lang || "en"; applyLang();
  if(q.view && VIEWS[q.view]) CUR=q.view;
  DB._tour = q.tour!=="0" && !DB.settings.welcomed;
  DB.seq=DB.seq||{SI:1000,PI:1000,RV:1000,PV:1000,JV:1000,TR:1000};
  if(!DB.journals.length) demoPost();
  save(); draw();
  if(DB._tour){ DB.settings.welcomed=true; delete DB._tour; save(); welcomeGuide(); }
}

/* ============================================================
   MIZAN demo · 06 · the contracting flow

   Estimate (BOQ priced by resource build-up) -> Quotation -> Won
   -> the estimate becomes the project's BUDGET as cost codes
   -> costs are tagged to a cost code
   -> budget vs committed vs actual vs forecast

   The same shape as the production system, in one file.
   ============================================================ */

const CAT = [
  ["material","Material","مواد"], ["labour","Labour","عمالة"],
  ["plant","Plant","معدات"], ["subcontract","Subcontract","مقاولو الباطن"],
  ["other","Other","أخرى"]
];

/* Which cost column an account belongs to, so actuals line up with
   the way the job was priced. */
const ACCT_CAT = {
  "5200":"subcontract","5210":"material","5100":"material","5250":"material",
  "5220":"labour","5230":"plant","5240":"other"
};

const estLineCost = l => CAT.reduce((s,[k])=>s+R2((+l.qty||0)*(+l[k]||0)),0);
const estCost = e => R2((e.lines||[]).reduce((s,l)=>s+estLineCost(l),0));
const markup = e => (1+(+e.contingencyPct||0)/100)*(1+(+e.overheadPct||0)/100)*(1+(+e.profitPct||0)/100);
const estSell = e => R2(estCost(e)*markup(e));
const estLineSell = (e,l) => R2(estLineCost(l)*markup(e));
const estMarginPct = e => { const s=estSell(e); return s? Math.round((s-estCost(e))/s*1000)/10 : null; };

/* ---------- cost codes: budget, actual, committed, forecast ---------- */
function costCodes(projectId){
  return (DB.costCodes||[]).filter(c=>c.project===projectId);
}
function ccActual(cc){
  let total=0; const by={material:0,labour:0,plant:0,subcontract:0,other:0};
  DB.journals.forEach(j=>j.lines.forEach(l=>{
    if(l.costCode!==cc.id) return;
    const a=acct(l.account); if(!a||!["COS","EXPENSE"].includes(a.type)) return;
    const v=R2(l.dr-l.cr); total=R2(total+v);
    const k=ACCT_CAT[l.account]||"other"; by[k]=R2(by[k]+v);
  }));
  return {total,by};
}
const ccBudget = cc => R2(CAT.reduce((s,[k])=>s+(+cc.budget[k]||0),0));
function ccCommitted(cc){
  /* subcontract packages awarded, plus purchase orders placed: both
     are money spent from the day of the order */
  const sub=R2((DB.packages||[]).filter(p=>p.costCode===cc.id&&p.status==="Awarded")
    .reduce((s,p)=>s+R2(p.value-pkgCertified(p.id)),0));
  const po=(typeof poCommitted==="function")?poCommitted(cc.id):0;
  return R2(sub+po);
}
const ccForecast = cc => Math.max(R2(ccActual(cc).total+ccCommitted(cc)), ccBudget(cc));
const pkgCertified = id => R2(DB.journals.filter(j=>j.doc&&j.doc.package===id)
  .reduce((s,j)=>s+(+j.doc.gross||0),0));

function cvr(p){
  const cc=costCodes(p.id);
  const budget=R2(cc.reduce((s,c)=>s+ccBudget(c),0));
  const actual=R2(cc.reduce((s,c)=>s+ccActual(c).total,0));
  const committed=R2(cc.reduce((s,c)=>s+ccCommitted(c),0));
  const forecast=R2(cc.reduce((s,c)=>s+ccForecast(c),0));
  const vos=R2((DB.variations||[]).filter(v=>v.project===p.id&&v.status==="Approved")
    .reduce((s,v)=>s+(+v.sell||0),0));
  const revised=R2(p.value+vos);
  return {budget,actual,committed,forecast,variations:vos,revised,
    marginPriced:R2(revised-budget), marginForecast:R2(revised-forecast),
    overrun:R2(forecast-budget), certified:projRevenue(p.id)};
}

    cc.forEach(c=>{

      html+='<tr><td class="code">'+esc(c.code)+'</td><td>'+esc(c.desc)+'</td>'+

        '<td class="num '+(vnc<0?"neg":"pos")+'">'+money(vnc)+'</td><td>'+
        (vnc<0?'<span class="tag red">'+esc(isAR()?"تجاوز":"Over")+'</span>'
             :'<span class="tag green">'+esc(isAR()?"ضمن الموازنة":"Within")+'</span>')+'</td></tr>';
    });
  });
  html+='<tr class="total"><td colspan="2">'+esc(t("Total"))+'</td><td class="num">'+money(tb)+
    '</td><td class="num">'+money(ta)+'</td><td class="num">'+money(tk)+'</td><td class="num">'+money(tf)+
    '</td><td class="num '+(R2(tb-tf)<0?"neg":"pos")+'">'+money(R2(tb-tf))+'</td><td></td></tr></tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"التوقّع = المصروف فعلياً + المرتبط به بأوامر لم تُفوتر بعد، أو الموازنة أيهما أكبر. لهذا يتحرك التوقّع يوم إصدار أمر الشراء لا يوم وصول الفاتورة."
    :"Forecast is what has been spent plus what is committed but not yet invoiced, or the budget, whichever is greater. That is why the forecast moves on the day an order is placed rather than the day the invoice arrives.")+'</p>'));
  return sheet("Cost Value Reconciliation",tp("asAt",fmtDate(today())),node);
}


/* ============================================================
   MIZAN demo · 07 · value of work done

   A certificate should not be a number somebody types. It should
   fall out of measuring what has actually been built against the
   bill of quantities the job was priced from.

     measure each cost code  ->  value of work done
     less what was certified before  ->  this period
     less retention and advance recovery  ->  net receivable

   Measuring also produces the number a contractor argues about
   most: value earned against cost incurred, and whether the job is
   over-billed or under-billed.
   ============================================================ */

const valuations = pid => (DB.valuations||[]).filter(v=>v.project===pid)
  .sort((a,b)=> a.date<b.date?-1: a.date>b.date?1:0);

/* Value of work done for one cost code, at a given percentage. */
const ccValue = (cc,pct) => R2((+cc.sell||0)*(+pct||0)/100);

/* Cumulative measured position, from the latest certified valuation. */
function measuredToDate(pid){
  const done = valuations(pid).filter(v=>v.status==="Certified");
  const last = done[done.length-1];
  const by = {};
  if(last) last.lines.forEach(l=>{ by[l.costCode]=+l.pct||0; });
  return {byCode:by, value:R2(Object.keys(by).reduce((s,k)=>{
    const cc=(DB.costCodes||[]).find(c=>c.id===k); return cc? s+ccValue(cc,by[k]) : s; },0)),
    valuation:last||null};
}

/* Where the job stands: earned against spent, and billing position. */
function workDone(p){
  const cc = costCodes(p.id);
  const m = measuredToDate(p.id);
  const vowd = m.value;
  const contract = R2(cc.reduce((s,c)=>s+(+c.sell||0),0));
  const certified = projRevenue(p.id);           // revenue actually posted
  const cost = R2(cc.reduce((s,c)=>s+ccActual(c).total,0));
  return {
    contract, vowd, certified, cost,
    pctComplete: contract? Math.round(vowd/contract*1000)/10 : 0,
    earnedMargin: R2(vowd-cost),
    earnedMarginPct: vowd? Math.round((vowd-cost)/vowd*1000)/10 : null,
    /* measured but not yet billed is accrued income; billed beyond
       measurement is income taken too early */
    underBilled: R2(vowd-certified),
    byCode: m.byCode, lastValuation: m.valuation
  };
}

/* ==================== MEASUREMENT ==================== */
function valuationForm(p){
  const cc = costCodes(p.id);
  if(!cc.length) { toast(isAR()?"لا توجد رموز تكلفة لهذا المشروع.":"This project has no cost codes to measure."); return; }
  const prev = measuredToDate(p.id);
  const rows = cc.map(c=>({costCode:c.id,code:c.code,desc:c.desc,unit:c.unit,
    qty:c.qty,sell:c.sell,pct:prev.byCode[c.id]||0}));

  formDoc({title:"Measure progress",wide:true,saveLabel:"Certify this valuation",
    fields:v=>[
      {n:"date",label:"Valuation date",type:"date",value:today()},
      {n:"advrec",label:"Advance recovered (QR)",type:"number",value:0},
      {n:"lines",label:"Measurement against the bill of quantities",type:"lines",full:true,
        newRow:()=>rows[0],
        cols:[
          {h:"Code",n:"code",w:"9%",readonly:true},
          {h:"Description",n:"desc",w:"26%",readonly:true},
          {h:"Contract value",num:1,w:"13%",calc:r=>+r.sell||0},
          {h:"% complete",n:"pct",type:"number",num:1,w:"11%"},
          {h:"Value of work done",num:1,w:"14%",calc:r=>{
            const c=(DB.costCodes||[]).find(x=>x.id===r.costCode); return c?ccValue(c,r.pct):0;}},
          {h:"Previously certified",num:1,w:"14%",calc:r=>{
            const c=(DB.costCodes||[]).find(x=>x.id===r.costCode); return c?ccValue(c,prev.byCode[r.costCode]||0):0;}},
          {h:"This period",num:1,w:"13%",calc:r=>{
            const c=(DB.costCodes||[]).find(x=>x.id===r.costCode); if(!c) return 0;
            return R2(ccValue(c,r.pct)-ccValue(c,prev.byCode[r.costCode]||0));}}
        ],
        value:rows}
    ],
    journal:v=>{
      const lines=(v.lines||[]);
      let gross=0;
      lines.forEach(l=>{ const c=(DB.costCodes||[]).find(x=>x.id===l.costCode); if(!c) return;
        gross=R2(gross+R2(ccValue(c,l.pct)-ccValue(c,prev.byCode[l.costCode]||0))); });
      if(gross<=0) return [];
      const ret=R2(gross*(p.retention||0)/100), adv=R2(v.advrec);
      const L=[{account:tagCode("ar"),dr:R2(gross-ret-adv),cr:0,party:p.customer,project:p.id,memo:"Net receivable"}];
      if(ret) L.push({account:tagCode("retention_rec"),dr:ret,cr:0,party:p.customer,project:p.id,memo:"Retention withheld"});
      if(adv) L.push({account:tagCode("cust_adv"),dr:adv,cr:0,party:p.customer,project:p.id,memo:"Advance recovered"});
      L.push({account:tagCode("sales_contract"),dr:0,cr:gross,project:p.id,memo:"Value of work done this period"});
      return L;
    },
    note:v=>{
      const lines=(v.lines||[]);
      let vowd=0, before=0;
      lines.forEach(l=>{ const c=(DB.costCodes||[]).find(x=>x.id===l.costCode); if(!c) return;
        vowd=R2(vowd+ccValue(c,l.pct)); before=R2(before+ccValue(c,prev.byCode[l.costCode]||0)); });
      const gross=R2(vowd-before);
      const contract=R2(costCodes(p.id).reduce((s,c)=>s+(+c.sell||0),0));
      const cost=R2(costCodes(p.id).reduce((s,c)=>s+ccActual(c).total,0));
      let out = esc(t("Value of work done"))+": <b>"+qr(vowd)+"</b> ("+
        (contract?Math.round(vowd/contract*1000)/10:0)+"% "+esc(isAR()?"من قيمة العقد":"of the contract")+")"+
        " &nbsp;·&nbsp; "+esc(t("Previously certified"))+": "+qr(before)+
        " &nbsp;·&nbsp; "+esc(t("This period"))+": <b>"+qr(gross)+"</b>";
      if(gross<0) out+='<br><span style="color:var(--maroon)">'+esc(isAR()
        ?"القياس أقل من المعتمد سابقاً؛ هذا يعني شهادة سالبة."
        :"That measures less than was already certified, which would be a negative certificate.")+'</span>';
      out+="<br><span style='color:var(--ink-soft)'>"+esc(t("Cost incurred"))+": "+money(cost)+
        " &nbsp;·&nbsp; "+esc(t("Earned margin"))+": "+money(R2(vowd-cost))+
        (vowd?" ("+Math.round((vowd-cost)/vowd*1000)/10+"%)":"")+"</span>";
      return out;
    },
    save:v=>{
      guardPost();
      const lines=(v.lines||[]).map(l=>({costCode:l.costCode,pct:+l.pct||0}));
      let vowd=0, before=0;
      lines.forEach(l=>{ const c=(DB.costCodes||[]).find(x=>x.id===l.costCode); if(!c) return;
        vowd=R2(vowd+ccValue(c,l.pct)); before=R2(before+ccValue(c,prev.byCode[l.costCode]||0)); });
      const gross=R2(vowd-before);
      if(gross<=0) throw new Error(isAR()?"لا توجد قيمة جديدة لاعتمادها."
        :"There is no new value to certify. Measure more progress first.");
      const ret=R2(gross*(p.retention||0)/100), adv=R2(v.advrec);
      const no=nextNo("IPC");
      const entry=Ledger.post({no,date:v.date,source:"Sales Invoice",project:p.id,
        memo:"Payment certificate "+no+" — "+p.code,lines:formDocJournal.lines,
        doc:{no,date:v.date,due:addDays(v.date,(DB.customers.find(c=>c.id===p.customer)||{}).terms||30),
          party:p.customer,type:"Contract certificate",project:p.id,
          gross,retention:ret,advance:adv,receivable:R2(gross-ret-adv),lines:[]}});
      DB.valuations=(DB.valuations||[]).concat([{
        id:"VAL"+Date.now(),ref:no,project:p.id,date:v.date,status:"Certified",
        lines,valueToDate:vowd,previous:before,thisPeriod:gross,entry:entry.id}]);
      commit("Certificate "+no+" raised from the measurement");
    }});
}

/* ==================== INCOME AND COST IN DETAIL ==================== */

/* Every posted transaction behind one cost code, so a figure can
   always be taken apart. */
function ccTransactions(ccId,category){
  const out=[];
  DB.journals.forEach(j=>j.lines.forEach(l=>{
    if(l.costCode!==ccId) return;
    const a=acct(l.account); if(!a||!["COS","EXPENSE"].includes(a.type)) return;
    const k=ACCT_CAT[l.account]||"other";
    if(category&&k!==category) return;
    out.push({date:j.date,no:j.no,source:j.source,account:l.account,
      party:l.party,memo:l.memo||j.memo,amount:R2(l.dr-l.cr),category:k});
  }));
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

/* The two tables that answer "where did the money come from, and
   where did it go" for one job. */
function incomeAndCost(m,p){
  const cc=costCodes(p.id);
  if(!cc.length) return;
  const wd=workDone(p);

  const g=h('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>');
  g.appendChild(stat("Contract value",money(wd.contract)));
  g.appendChild(stat("Value of work done",money(wd.vowd),wd.pctComplete+"% "+(isAR()?"مكتمل":"complete")));
  g.appendChild(stat("Certified",money(wd.certified)));
  g.appendChild(stat("Cost incurred",money(wd.cost)));
  g.appendChild(stat("Earned margin",money(wd.earnedMargin),
    wd.earnedMarginPct!=null?wd.earnedMarginPct+"%":"",wd.earnedMargin<0?"neg":"pos"));
  g.appendChild(stat(wd.underBilled>=0?"Under-billed":"Over-billed",money(Math.abs(wd.underBilled)),
    isAR()?"المقيس مقابل المعتمد":"measured against certified",wd.underBilled<0?"neg":""));
  m.appendChild(g);
  m.appendChild(h('<div style="height:14px"></div>'));

  if(Math.abs(wd.underBilled)>0.5){
    const under=wd.underBilled>0;
    m.appendChild(h('<div class="card" style="border-color:var(--'+(under?"amber":"maroon")+
      ');background:var(--'+(under?"amber":"maroon")+'-soft);margin-bottom:14px"><div class="body">'+
      '<b style="color:var(--'+(under?"amber":"maroon")+')">'+
      esc(under?(isAR()?"أعمال مقيسة لم تُفوتر بعد: "+money(wd.underBilled)
                       :"Work measured but not yet certified: "+money(wd.underBilled))
              :(isAR()?"فُوتر أكثر مما قِيس بمقدار "+money(-wd.underBilled)
                       :"Certified ahead of measurement by "+money(-wd.underBilled)))+'</b><br>'+
      '<span style="color:var(--ink-soft)">'+esc(under
        ?(isAR()?"هذه إيرادات مستحقة — ارفع شهادة دفع لتحصيلها."
                :"That is earned income sitting unbilled. Raise a certificate for it.")
        :(isAR()?"الإيراد أُخذ قبل إنجاز العمل؛ سيتعين تسويته."
                :"Income has been taken ahead of the work. It will have to unwind."))+'</span></div></div>'));
  }

  /* ---- income: what each line of the bill has earned ---- */
  const inc=table([
    {h:"Code",r:c=>'<span class="code">'+esc(c.code)+'</span>'},
    {h:"Description",r:c=>esc(c.desc)},
    {h:"Contract value",num:1,r:c=>money(c.sell)},
    {h:"% complete",num:1,r:c=>(wd.byCode[c.id]||0)+"%"},
    {h:"Value of work done",num:1,r:c=>money(ccValue(c,wd.byCode[c.id]||0))},
    {h:"Remaining",num:1,r:c=>money(R2((+c.sell||0)-ccValue(c,wd.byCode[c.id]||0)))}
  ],cc);
  const itb=inc.querySelector&&inc.querySelector("tbody");
  if(itb) itb.appendChild(h('<tr style="font-weight:700;border-top:1px solid var(--ink)"><td colspan="2">'+
    esc(t("Total"))+'</td><td class="num">'+money(wd.contract)+'</td><td></td><td class="num">'+
    money(wd.vowd)+'</td><td class="num">'+money(R2(wd.contract-wd.vowd))+'</td></tr>'));
  m.appendChild(card("Income by bill item",inc));
  m.appendChild(h('<div style="height:12px"></div>'));

  /* ---- cost: every line split the way it was priced, clickable ---- */
  const cost=table([
    {h:"Code",r:c=>'<span class="code">'+esc(c.code)+'</span>'},
    {h:"Description",r:c=>esc(c.desc)},
    {h:"Material",num:1,r:c=>{const v=ccActual(c).by.material;return v?money(v):"—";}},
    {h:"Labour",num:1,r:c=>{const v=ccActual(c).by.labour;return v?money(v):"—";}},
    {h:"Plant",num:1,r:c=>{const v=ccActual(c).by.plant;return v?money(v):"—";}},
    {h:"Subcontract",num:1,r:c=>{const v=ccActual(c).by.subcontract;return v?money(v):"—";}},
    {h:"Other",num:1,r:c=>{const v=ccActual(c).by.other;return v?money(v):"—";}},
    {h:"Total cost",num:1,r:c=>'<b>'+money(ccActual(c).total)+'</b>'},
    {h:"Budget",num:1,r:c=>money(ccBudget(c))},
    {h:"Variance",num:1,cls:c=>R2(ccBudget(c)-ccForecast(c))<0?"neg":"pos",
     r:c=>money(R2(ccBudget(c)-ccForecast(c)))}
  ],cc,{onRow:c=>costDetailModal(c)});
  const ctb=cost.querySelector&&cost.querySelector("tbody");
  if(ctb){
    const tot=k=>money(R2(cc.reduce((s,c)=>s+ccActual(c).by[k],0)));
    ctb.appendChild(h('<tr style="font-weight:700;border-top:1px solid var(--ink)"><td colspan="2">'+
      esc(t("Total"))+'</td><td class="num">'+tot("material")+'</td><td class="num">'+tot("labour")+
      '</td><td class="num">'+tot("plant")+'</td><td class="num">'+tot("subcontract")+
      '</td><td class="num">'+tot("other")+'</td><td class="num">'+money(wd.cost)+
      '</td><td class="num">'+money(R2(cc.reduce((s,c)=>s+ccBudget(c),0)))+'</td><td></td></tr>'));
  }
  m.appendChild(card("Cost by bill item — click any line for the transactions behind it",cost));
  m.appendChild(h('<div style="height:12px"></div>'));

  /* ---- the measurement history ---- */
  const vals=valuations(p.id);
  m.appendChild(card("Valuation history",table([
    {h:"Reference",r:v=>'<span class="code">'+esc(v.ref)+'</span>'},
    {h:"Date",r:v=>fmtDate(v.date)},
    {h:"Value of work done",num:1,r:v=>money(v.valueToDate)},
    {h:"Previously certified",num:1,r:v=>money(v.previous)},
    {h:"This period",num:1,r:v=>'<b>'+money(v.thisPeriod)+'</b>'},
    {h:"% complete",num:1,r:v=>{const c=R2(costCodes(p.id).reduce((s,x)=>s+(+x.sell||0),0));
      return c?Math.round(v.valueToDate/c*1000)/10+"%":"—";}}
  ],vals,{emptyTitle:"Nothing here yet",
    emptyBody:isAR()?"لم يُقَس أي تقدّم بعد."
      :"No progress has been measured yet. Use \u201cMeasure progress\u201d to value the work."})));
  m.appendChild(h('<div style="height:12px"></div>'));
}

      '</td></tr>';
  });
  html+='<tr class="total"><td colspan="2">'+esc(t("Total"))+'</td><td class="num">'+money(tc)+
    '</td><td class="num">'+money(tv)+'</td><td></td><td class="num">'+money(tk)+
    '</td><td class="num">'+money(R2(tv-tk))+'</td><td class="num">'+money(tx)+
    '</td><td class="num '+(R2(tv-tx)<0?"neg":"pos")+'">'+money(R2(tv-tx))+'</td><td></td></tr></tbody></table>';

  node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">'+esc(isAR()
    ?"قيمة الأعمال المنجزة تُقاس من جدول الكميات، لا تُكتب يدوياً. الفرق بينها وبين المعتمد هو إيراد مستحق لم يُفوتر (أو إيراد أُخذ مبكراً)، والفرق بينها وبين التكلفة هو الهامش المكتسب فعلاً حتى تاريخه."
    :"Value of work done is measured against the bill of quantities rather than typed. The gap to what has been certified is income earned but not yet billed \u2014 or billed too early. The gap to cost incurred is the margin actually earned so far.")+'</p>'));
  return sheet("Value of Work Done",tp("asAt",fmtDate(today())),node);
}


/* ============================================================
   MIZAN demo · 08 · compliance, guarantees, WPS

   The documents that stop work when they lapse. A Qatar ID that
   expires stops a man on site; a commercial registration that
   expires stops the company tendering; an advance payment guarantee
   that expires can hold a certificate hostage.

   None of it is accounting. All of it costs money when missed.
   ============================================================ */

const DOC_TYPES = {
  EMPLOYEE:[["QID","Qatar ID","البطاقة الشخصية"],["PASSPORT","Passport","جواز السفر"],
    ["VISA","Residence permit","الإقامة"],["HEALTH","Health card","البطاقة الصحية"],
    ["LICENCE","Driving licence","رخصة القيادة"],["CONTRACT","Labour contract","عقد العمل"]],
  COMPANY:[["CR","Commercial registration","السجل التجاري"],
    ["TRADE","Trade licence","الرخصة التجارية"],["COMPUTER","Computer card","البطاقة الإلكترونية"],
    ["CHAMBER","Chamber of Commerce","الغرفة التجارية"],["MUNICIPALITY","Municipality permit","رخصة البلدية"]],
  VEHICLE:[["ISTIMARA","Istimara","الاستمارة"],["INSURANCE","Insurance","التأمين"],
    ["INSPECTION","Technical inspection","الفحص الفني"]]
};
const GUARANTEE_TYPES=[["APG","Advance payment guarantee","ضمان الدفعة المقدمة"],
  ["PERF","Performance bond","ضمان حسن التنفيذ"],["RET","Retention bond","ضمان المحتجزات"],
  ["TENDER","Tender bond","ضمان ابتدائي"],["LABOUR","Labour guarantee","ضمان العمالة"]];

const docTypeLabel = (kind,code) => {
  const row=(DOC_TYPES[kind]||[]).find(x=>x[0]===code);
  return row? (isAR()?row[2]:row[1]) : code;
};
const guaranteeLabel = code => {
  const row=GUARANTEE_TYPES.find(x=>x[0]===code);
  return row? (isAR()?row[2]:row[1]) : code;
};

/* Days until expiry, and how alarmed to be about it. */
function expiry(d){
  const days = daysBetween(today(), d.expires);
  return {days,
    state: days<0 ? "expired" : days<=30 ? "critical" : days<=90 ? "soon" : "ok",
    tone:  days<0 ? "red"     : days<=30 ? "red"      : days<=90 ? "amber" : "green"};
}

/* Everything expiring, worst first. Guarantees sit in the same list

function expiringAll(withinDays){
  const out=[];
  (DB.docs||[]).forEach(d=>{ const e=expiry(d);
    if(withinDays==null||e.days<=withinDays)
      out.push({id:d.id,what:docTypeLabel(d.kind,d.type),who:docHolder(d),number:d.number,
        expires:d.expires,days:e.days,state:e.state,tone:e.tone,kind:d.kind,source:"doc"}); });
  (DB.guarantees||[]).filter(g=>g.status==="Active").forEach(g=>{ const e=expiry(g);
    if(withinDays==null||e.days<=withinDays)
      out.push({id:g.id,what:guaranteeLabel(g.type),who:g.project?projCode(g.project):custName(g.party),
        number:g.number,expires:g.expires,days:e.days,state:e.state,tone:e.tone,
        kind:"GUARANTEE",value:g.value,source:"guarantee"}); });
  return out.sort((a,b)=>a.days-b.days);
}

/* ==================== WPS ====================
   Qatar's Wage Protection System expects a Salary Information File
   from the employer, uploaded to the bank. Banks issue their own
   template and the column order differs between them, so this
   produces the standard content and says plainly that the layout
   must be confirmed with the bank before the first live upload. */
function wpsForm(){
  formDoc({title:"Wage Protection System file",wide:true,saveLabel:"Download the file",
    fields:()=>[
      {n:"month",label:"Salary month",type:"date",value:monthEnd(today())},
      {n:"employerId",label:"Employer identification number",value:DB.company.cr||""},
      {n:"bank",label:"Employer bank",type:"select",options:["QNB","Commercial Bank","Doha Bank","QIB"],value:"QNB"},
      {n:"payDate",label:"Payment date",type:"date",value:today()}
    ],
    note:v=>{
      const staff=DB.employees.filter(e=>e.active);
      const gross=R2(staff.reduce((s,e)=>s+e.basic+e.allow,0));
      const noIban=staff.filter(e=>!e.iban).length;
      let out=staff.length+" "+esc(t("Employees"))+" · "+esc(t("Total"))+" <b>"+qr(gross)+"</b>";
      if(noIban) out+='<br><span style="color:var(--maroon)">'+esc(isAR()
        ?noIban+" موظف بدون رقم آيبان — سيرفض البنك الملف."
        :noIban+" employee(s) have no IBAN. The bank will reject the file.")+'</span>';
      out+='<br><span style="color:var(--ink-soft)">'+esc(isAR()
        ?"لكل بنك قالب SIF خاص به؛ أكّد ترتيب الأعمدة مع البنك قبل أول رفع فعلي."
        :"Each bank issues its own SIF template. Confirm the column order with the bank before the first live upload.")+'</span>';
      return out;
    },
    save:v=>{
      const staff=DB.employees.filter(e=>e.active);
      if(!staff.length) throw new Error("There are no active employees.");
      const end=monthEnd(v.month), ym=end.slice(0,7).replace("-","");
      const gross=R2(staff.reduce((s,e)=>s+e.basic+e.allow,0));
      const rows=[];
      /* employer record */
      rows.push(["EDR",v.employerId,v.bank,ym,v.payDate.replace(/-/g,""),
        staff.length,gross.toFixed(2),"QAR"].join(","));
      /* one salary record per employee */
      staff.forEach(e=>{
        rows.push(["SIF",e.qid||"",e.name,e.bank||"",e.iban||"",
          "M",30,R2(e.basic+e.allow).toFixed(2),R2(e.basic).toFixed(2),
          R2(e.allow).toFixed(2),"0.00","0.00"].join(","));
      });
      const csv=rows.join("\r\n")+"\r\n";
      const name="WPS_"+(v.employerId||"EMP").replace(/\W/g,"")+"_"+ym+".csv";
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download=name; document.body.appendChild(a); a.click(); a.remove();
      toast(name+" — "+staff.length+" records");
    }});
}


/* ============================================================
   MIZAN demo · 09 · documents that leave the building

   An invoice a client receives, a certificate a consultant signs
   and a statement an auditor reads are not screens. They are pieces
   of paper with a letterhead, both languages, and somewhere to
   sign. Everything here renders to A4 and prints.
   ============================================================ */

const coName   = () => isAR() && DB.company.nameAr ? DB.company.nameAr : DB.company.name;
const coNameAlt= () => isAR() ? DB.company.name : (DB.company.nameAr||"");

/* Money in words: Qatari invoices carry it, and clients query the
   figure far less often when the words agree with it. */
function inWords(v){
  const ones=["zero","one","two","three","four","five","six","seven","eight","nine","ten",
    "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const under1000=n=>{
    if(n<20) return ones[n];
    if(n<100) return tens[Math.floor(n/10)]+(n%10?"-"+ones[n%10]:"");
    return ones[Math.floor(n/100)]+" hundred"+(n%100?" and "+under1000(n%100):"");
  };
  const chunk=(n,label)=>n?under1000(n)+" "+label+" ":"";
  const num=Math.abs(R2(v)); const whole=Math.floor(num);
  const fils=Math.round((num-whole)*100);
  if(whole===0&&!fils) return "zero riyals";
  let s="";
  s+=chunk(Math.floor(whole/1e6),"million");
  s+=chunk(Math.floor((whole%1e6)/1000),"thousand");
  s+=whole%1000?under1000(whole%1000)+" ":"";
  s=s.trim()+" riyal"+(whole===1?"":"s");
  if(fils) s+=" and "+under1000(fils)+" dirham"+(fils===1?"":"s");
  return s.replace(/\s+/g," ").trim();
}

    '<div class="doctitle"><b>'+esc(title)+'</b><i>'+esc(titleAr)+'</i>'+
      (ref?'<span class="code">'+esc(ref)+'</span>':'')+'</div></div>';

function printInvoice(j){
  const d=j.doc||{}; const cust=DB.customers.find(c=>c.id===d.party)||{};

  const p=d.project?DB.projects.find(x=>x.id===d.project):null;

  let lines='';
  if(cert){
    lines='<tr><td>'+bi("Value of work certified this period","قيمة الأعمال المعتمدة لهذه الفترة")+
      '</td><td class="num">'+money(d.gross)+'</td></tr>';
    if(+d.retention) lines+='<tr><td>'+bi("Less retention","يُخصم المحتجزات")+
      ' ('+(p?p.retention:10)+'%)</td><td class="num">('+money(d.retention)+')</td></tr>';
    if(+d.advance) lines+='<tr><td>'+bi("Less advance recovered","يُخصم استرداد الدفعة المقدمة")+

  } else {
    lines='<tr class="lh"><td>'+bi("Description","البيان")+'</td><td class="num">'+bi("Amount","المبلغ")+'</td></tr>';
    (d.lines||[]).forEach(l=>{
      const it=DB.items.find(x=>x.id===l.item);
      lines+='<tr><td>'+esc(it?it.name:(l.desc||""))+
        ' <span class="code">'+money(l.qty)+' × '+money(l.rate)+'</span></td>'+
        '<td class="num">'+money(R2(l.qty*l.rate))+'</td></tr>';
    });
    if(!(d.lines||[]).length) lines+='<tr><td>'+esc(j.memo)+'</td><td class="num">'+money(d.gross)+'</td></tr>';
  }

  printDoc(cert?"Payment certificate":"Tax invoice", cert?"شهادة دفع":"فاتورة ضريبية",
    letterhead(cert?"PAYMENT CERTIFICATE":"TAX INVOICE",
               cert?"شهادة دفع":"فاتورة ضريبية", d.no)+
    '<table class="meta"><tr>'+
      '<td>'+bi("To","إلى")+'<br><b>'+esc(cust.name||"")+'</b><br>'+
        esc(cust.addr||"")+'<br><span class="code">'+esc(cust.cr||"")+'</span></td>'+
      '<td class="num">'+bi("Date","التاريخ")+' '+fmtDate(d.date)+'<br>'+
        bi("Due","تاريخ الاستحقاق")+' '+fmtDate(d.due)+'<br>'+

/* ============================================================
   MIZAN demo · 10 · procurement

     requisition  ->  order  ->  goods received  ->  invoice

   The point is the middle two. An order is a commitment: the money
   is spent the day it is placed, not the day the invoice arrives.
   Goods received but not invoiced is a real liability, and it is
   where a trading company's margin quietly leaks — because nobody
   checks that the invoice matches what was ordered and what turned
   up.

   Landed cost matters for the same reason. Freight, duty and
   clearing belong in the value of the stock they relate to. Left in
   overheads, imported stock is undervalued and gross margin looks
   better than it is.
   ============================================================ */

const REQ_STATUS=["Draft","Approved","Ordered","Rejected"];
const PO_STATUS=["Open","Part received","Received","Closed","Cancelled"];

const reqs   = () => DB.requisitions||[];
const orders = () => DB.orders||[];
const grns   = () => DB.grns||[];

const poReceived = poId => R2(grns().filter(g=>g.order===poId)
  .reduce((s,g)=>s+R2((g.lines||[]).reduce((x,l)=>x+R2((+l.qty||0)*(+l.rate||0)),0)),0));
const poInvoiced = poId => R2(DB.journals.filter(j=>j.doc&&j.doc.order===poId)
  .reduce((s,j)=>s+(+j.doc.gross||0),0));
const poValue = po => R2((po.lines||[]).reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0));
const poOpen  = po => R2(poValue(po)-poReceived(po.id));

/* Goods received but not yet invoiced — a liability that exists
   whether or not anyone has recorded it. */
const grniBalance = () => R2(grns().reduce((s,g)=>s+grnValue(g),0)
  - R2(DB.journals.filter(j=>j.doc&&j.doc.grn).reduce((s,j)=>s+(+j.doc.gross||0),0)));
const grnValue = g => R2((g.lines||[]).reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0));
const grnInvoiced = gid => DB.journals.some(j=>j.doc&&j.doc.grn===gid);

/* Open orders are committed cost, exactly like a subcontract. */
function poCommitted(costCodeId){
  return R2(orders().filter(o=>o.costCode===costCodeId&&["Open","Part received"].includes(o.status))
    .reduce((s,o)=>s+poOpen(o),0));
}

            {h:"Item",n:"item",type:"select",w:"32%",options:[{v:"",l:"— "+t("Description")+" —"}]
              .concat(DB.items.map(i=>({v:i.id,l:i.code+" · "+i.name})))},
            {h:"Description",n:"desc",w:"24%"},
            {h:"Quantity",n:"qty",type:"number",num:1,w:"12%"},

            {h:"Value",num:1,calc:r=>R2((+r.qty||0)*(+r.rate||0))}
          ]}
      ];
    },
    note:v=>{
      const val=R2((v.lines||[]).reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0));
      let out=esc(isAR()?"قيمة الأمر":"Order value")+": <b>"+qr(val)+"</b>";

        out+="<br>"+esc(t("Budget"))+" "+money(b)+" · "+esc(isAR()?"بعد هذا الأمر":"after this order")+
          " <b>"+money(committed)+"</b>";
        if(committed>b) out+='<br><span style="color:var(--maroon)">'+esc(isAR()
          ?"سيتجاوز هذا الأمر موازنة البند بمقدار "+money(R2(committed-b))
          :"This order takes the cost code "+money(R2(committed-b))+" over its budget.")+'</span>';
      }
      out+="<br><span style='color:var(--ink-soft)'>"+esc(isAR()
        ?"الأمر لا يُقيَّد، لكنه ارتباط: يظهر في التكلفة الملتزم بها من يوم إصداره."
        :"An order posts nothing, but it commits: it counts as committed cost from the day it is placed.")+"</span>";
      return out;
    },
    save:v=>{
      guardPost();
      const lines=(v.lines||[]).filter(l=>(+l.qty||0)>0);
      if(!lines.length) throw new Error("Add at least one line.");
      const ref=nextNo("PO");
      DB.orders=(DB.orders||[]).concat([{id:"PO"+Date.now(),ref,party:v.party,date:v.date,
        delivery:v.delivery,project:v.project,costCode:v.costCode,terms:v.terms,
        status:"Open",lines,requisition:src?src.id:""}]);
      if(src){ src.status="Ordered"; src.order=ref; }
      commit("Order "+ref+" placed");
    }});

/* ---------- goods received ----------
   Dr stock (or project cost) / Cr goods received not invoiced.
   The liability exists on delivery, not on invoice. */
function grnForm(order){
  const open=orders().filter(o=>["Open","Part received"].includes(o.status));
  formDoc({title:"Goods received note",wide:true,saveLabel:"Post the receipt",
    fields:v=>{
      const o=orders().find(x=>x.id===v.order)||order;
      const outstanding=o?(o.lines||[]).map(l=>{
        const already=R2(grns().filter(g=>g.order===o.id)
          .reduce((s,g)=>s+R2((g.lines||[]).filter(x=>x.item===l.item&&x.desc===l.desc)
            .reduce((y,x)=>y+(+x.qty||0),0)),0));
        return {item:l.item,desc:l.desc,qty:R2((+l.qty||0)-already),rate:l.rate};
      }).filter(l=>l.qty>0):[];
      return [
        {n:"order",label:"Against order",type:"select",
         options:open.map(x=>({v:x.id,l:x.ref+" · "+suppName(x.party)+" · "+money(poOpen(x))})),
         value:order?order.id:(open[0]||{}).id},
        {n:"date",label:"Received on",type:"date",value:today()},
        {n:"dn",label:"Supplier delivery note",value:""},
        {n:"lines",label:"Received",type:"lines",full:true,syncOn:"order",

              .concat(DB.items.map(i=>({v:i.id,l:i.code+" · "+i.name})))},

          ]},

      const L=[];

      lines.forEach(l=>{

      });

        project:o?o.project:"",costCode:o?o.costCode:"",memo:"Goods received"}));
      if(freight){
        /* landed cost belongs in the value of the goods it carried */
        const first=Object.keys(byAcct)[0];
        L.push({account:first,dr:freight,cr:0,project:o?o.project:"",
          costCode:o?o.costCode:"",memo:"Freight, duty and clearing"});
        L.push({account:"2110",dr:0,cr:freight,party:o?o.party:"",memo:"Clearing agent"});
      }
      L.push({account:"2121",dr:0,cr:val,party:o?o.party:"",memo:"Goods received not invoiced"});
      return L;
    },
    note:v=>{
      const lines=(v.lines||[]).filter(l=>(+l.qty||0)>0);
      const val=R2(lines.reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0));
      const freight=R2(v.freight);
      let out=esc(t("Value"))+": <b>"+qr(val)+"</b>";
      if(freight){
        out+=" &nbsp;·&nbsp; "+esc(isAR()?"تكلفة الوصول":"Landed cost")+": <b>"+qr(freight)+"</b> ("+
          (val?Math.round(freight/val*1000)/10:0)+"%)";
        out+="<br><span style='color:var(--ink-soft)'>"+esc(isAR()
          ?"تُوزَّع على قيمة البضاعة فترفع متوسط التكلفة؛ لو تُركت في المصروفات لبدا هامش الربح أفضل مما هو."
          :"Added to the value of the goods, which raises the average cost. Left in overheads, the margin would look better than it is.")+"</span>";
      }
      out+="<br><span style='color:var(--ink-soft)'>"+esc(isAR()
        ?"يُقيَّد الاستلام على حساب «بضاعة مستلمة غير مفوترة» حتى تصل فاتورة المورد."
        :"Posted to Goods Received Not Invoiced until the supplier's invoice arrives.")+"</span>";
      return out;
    },
    save:v=>{
      guardPost();
      const o=orders().find(x=>x.id===v.order);
      const lines=(v.lines||[]).filter(l=>(+l.qty||0)>0);
      if(!lines.length) throw new Error("Nothing has been received.");
      const val=R2(lines.reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0));
      const freight=R2(v.freight);
      const ref=nextNo("GRN");
      const entry=Ledger.post({no:ref,date:v.date,source:"Goods Received",
        project:o?o.project:"",memo:"Goods received — "+(o?o.ref:"")+(v.dn?" · DN "+v.dn:""),
        lines:formDocJournal.lines,doc:{no:ref,grnOf:o?o.id:""}});
      /* stock in at the order price, then the landed cost on top */
      lines.forEach(l=>{ if(l.item) moveStock(l.item,+l.qty||0,+l.rate||0,ref,v.date,o?o.project:"",entry.id); });
      if(freight) spreadLandedCost(lines,freight,ref,v.date);
      DB.grns=(DB.grns||[]).concat([{id:"GR"+Date.now(),ref,order:o?o.id:"",party:o?o.party:"",
        date:v.date,dn:v.dn,lines,landed:freight,entry:entry.id}]);
      if(o) o.status = poOpen(o)<=0.004 ? "Received" : "Part received";
      commit("Receipt "+ref+" posted");
    }});
}

/* Freight and duty spread across the goods by value, so the item
   that cost more to buy also carries more of the cost of getting
   it here. */
function spreadLandedCost(lines,freight,ref,date){
  const total=R2(lines.reduce((s,l)=>s+R2((+l.qty||0)*(+l.rate||0)),0));
  if(!total) return;
  let spread=0;
  lines.forEach((l,i)=>{
    if(!l.item) return;
    const share = i===lines.length-1
      ? R2(freight-spread)                                   // last line takes the rounding
      : R2(freight*R2((+l.qty||0)*(+l.rate||0))/total);
    spread=R2(spread+share);
    if(share) addStockValue(l.item,share,ref+" landed",date);
  });
}

/* Value added to stock without any quantity: the average cost rises,
   the count does not. */
function addStockValue(itemId,value,ref,date){
  const it=DB.items.find(i=>i.id===itemId); if(!it||!value) return;
  if(it.val==null) it.val=R2(it.qty*it.cost);
  it.val=R2(it.val+R2(value));
  if(it.qty>0.00001) it.cost=it.val/it.qty;
  DB.stockMoves.push({id:"M"+Date.now()+Math.floor(Math.random()*99),date,item:itemId,
    qty:0,cost:0,value:R2(value),ref,project:"",balance:it.qty,wac:it.cost,landed:true});
}

/* ---------- the three-way match ----------
   order price against received quantity against invoiced amount.
   Any difference is a purchase price variance, posted, not buried. */
function matchForm(g){
  const o=orders().find(x=>x.id===g.order);
  const expected=grnValue(g);
  formDoc({title:"Match the supplier invoice",wide:true,saveLabel:"Post the invoice",
    fields:()=>[
      {n:"ref",label:"Supplier invoice no.",value:""},
      {n:"date",label:"Invoice date",type:"date",value:today()},
      {n:"amount",label:"Invoice amount (QR)",type:"number",value:expected},
      {n:"_",label:"",type:"html",value:
        '<div style="border:1px solid var(--rule-strong);border-radius:4px;background:var(--field);padding:10px 12px;font-size:13px">'+
        '<b>'+esc(isAR()?"المطابقة الثلاثية":"Three-way match")+'</b><table style="margin-top:6px">'+
        '<tr><td>'+esc(t("Order"))+'</td><td class="num code">'+(o?esc(o.ref):"—")+'</td><td class="num">'+
          (o?money(poValue(o)):"—")+'</td></tr>'+
        '<tr><td>'+esc(t("Goods received note"))+'</td><td class="num code">'+esc(g.ref)+'</td><td class="num">'+
          money(expected)+'</td></tr></table></div>'}
    ],
    journal:v=>{
      const amt=R2(v.amount); if(!amt) return [];
      const diff=R2(amt-expected);
      const L=[{account:"2121",dr:expected,cr:0,party:g.party,memo:"Clearing goods received"}];
      if(diff>0) L.push({account:"5105",dr:diff,cr:0,project:o?o.project:"",
        costCode:o?o.costCode:"",memo:"Purchase price variance"});
      if(diff<0) L.push({account:"5105",dr:0,cr:-diff,project:o?o.project:"",
        costCode:o?o.costCode:"",memo:"Purchase price variance"});
      L.push({account:"2110",dr:0,cr:amt,party:g.party,memo:"Supplier invoice "+(v.ref||"")});
      return L;
    },
    note:v=>{
      const amt=R2(v.amount), diff=R2(amt-expected);
      let out=esc(t("Goods received note"))+" "+money(expected)+" &nbsp;·&nbsp; "+
        esc(isAR()?"الفاتورة":"Invoice")+" "+money(amt);
      if(Math.abs(diff)<0.005) out+='<br><span style="color:var(--ledger-green,#14624A)">'+
        esc(isAR()?"مطابق تماماً.":"Matches exactly.")+'</span>';
      else {
        const pct=expected?Math.round(Math.abs(diff)/expected*1000)/10:0;
        out+='<br><span style="color:var(--maroon)">'+esc(isAR()
          ?(diff>0?"الفاتورة أعلى بمقدار ":"الفاتورة أقل بمقدار ")+money(Math.abs(diff))+" ("+pct+"%)"
          :(diff>0?"Invoice is ":"Invoice is ")+money(Math.abs(diff))+" "+(diff>0?"higher":"lower")+" ("+pct+"%)")+
          '</span><br><span style="color:var(--ink-soft)">'+esc(isAR()
          ?"يُقيَّد الفرق على فروق أسعار الشراء بدلاً من إخفائه في تكلفة المخزون."
          :"The difference posts to purchase price variance rather than disappearing into stock cost.")+'</span>';
      }
      return out;
    },
    save:v=>{
      guardPost();
      const amt=R2(v.amount);
      if(amt<=0) throw new Error("Enter the invoice amount.");
      const sup=DB.suppliers.find(s=>s.id===g.party)||{};
      const no=nextNo("PI");
      Ledger.post({no,date:v.date,source:"Purchase Invoice",project:o?o.project:"",
        memo:"Supplier invoice "+(v.ref||"")+" matched to "+g.ref,lines:formDocJournal.lines,
        doc:{no,date:v.date,due:addDays(v.date,sup.terms||30),party:g.party,
          type:"Goods for stock",ref:v.ref,project:o?o.project:"",grn:g.id,order:o?o.id:"",
          gross:amt,retention:0,receivable:amt}});
      if(o&&poOpen(o)<=0.004) o.status="Closed";
      commit("Invoice matched and posted");
    }});
}

/* ============================================================
   MIZAN demo · 11 · labour and plant

   Payroll already posts the wage bill. Timesheets must therefore
   ALLOCATE that cost to the work, not add to it, or every hour
   would be paid for twice.

   So project wages land first in a holding account — labour to be
   allocated — and the timesheet moves them out to a cost code. What
   is left in the holding account is labour nobody booked to a job:
   idle time, sickness, rain, or a foreman who never filled in his
   sheet. That balance is the number worth watching.

   Plant works the same way round. An owned excavator is charged to
   the job at an internal hire rate, and the recovery is credited
   against what the plant actually costs to own and run.
   ============================================================ */

const HOURS_PER_DAY = 8;
const DAYS_PER_MONTH = 30;                 /* Qatar convention */
/* Two different rates, and the difference matters.

   What an hour COSTS the company is basic plus allowances, because
   that is what payroll charged. Absorbing at basic alone would leave
   every allowance stranded in the holding account for ever, and the
   "unallocated wages" figure would be meaningless.

   What an hour of OVERTIME PAYS is based on the basic wage, because
   that is what the Labour Law says. */
const hourlyRate = e => R2(((+e.basic||0)+(+e.allow||0))/DAYS_PER_MONTH/HOURS_PER_DAY);
const otHourlyRate = e => R2((+e.basic||0)/DAYS_PER_MONTH/HOURS_PER_DAY);

/* Qatar Labour Law: overtime is paid at not less than 125% of the
   basic wage, and 150% for night work or a rest day. */
const OT_RATES=[["1.25","Overtime 125%","عمل إضافي ١٢٥٪"],
                ["1.50","Overtime 150% — night or rest day","عمل إضافي ١٥٠٪ — ليلي أو يوم راحة"]];

const timesheets = () => DB.timesheets||[];
const plantLogs  = () => DB.plantLogs||[];

const tsLineCost = l => {
  const e=DB.employees.find(x=>x.id===l.employee); if(!e) return {normal:0,ot:0,total:0};
  const normal=R2(hourlyRate(e)*(+l.normal||0));
  const ot=R2(otHourlyRate(e)*(+l.ot||0)*(+l.otRate||1.25));
  return {normal,ot,total:R2(normal+ot)};
};
const tsTotal = ts => R2((ts.lines||[]).reduce((s,l)=>s+tsLineCost(l).total,0));

/* Wages posted to the holding account, less what timesheets have
   moved out of it. */
const unallocatedLabour = () => Ledger.show("5221");

      {h:"Basic",num:1,r:e=>money(e.basic)},
      {h:"Gratuity accrued",num:1,r:e=>money(R2(-Ledger.bal("2210",{party:e.id})))},
      {h:"Leave accrued",num:1,r:e=>money(R2(-Ledger.bal("2126",{party:e.id})))},

      {h:"Advance due",num:1,cls:()=>"neg",r:e=>{const a=Ledger.bal("1155",{party:e.id});return a?money(a):"—";}},
      {h:"Total",num:1,r:e=>'<b>'+money(R2(-Ledger.bal("2210",{party:e.id})
        -Ledger.bal("2126",{party:e.id})-Ledger.bal("2127",{party:e.id})))+'</b>'}

/* ---------- timesheet: move the wage bill onto the work ---------- */
function timesheetForm(){
  const staff=DB.employees.filter(e=>e.active&&e.project);
  formDoc({title:"Weekly timesheet",wide:true,saveLabel:"Allocate the hours",

/* ---------- leave and air ticket ----------
   Qatar Labour Law: three weeks of annual leave a year under five
   years of service, four weeks after that, paid at basic wage. The
   home ticket is a contractual cost most employers carry too. */
const leaveDaysPerYear = e => svcYears(e) >= 5 ? 28 : 21;
const leaveMonthly = e => R2((+e.basic||0)/DAYS_PER_MONTH*leaveDaysPerYear(e)/12);
const ticketMonthly = e => R2((+e.ticket||1800)/12);

function leaveForm(){
  formDoc({title:"Accrue leave and air tickets",wide:true,saveLabel:"Post the provision",
    fields:()=>[{n:"month",label:"Month ending",type:"date",value:monthEnd(today())}],
    journal:v=>{
      const staff=DB.employees.filter(e=>e.active);
      const leave=R2(staff.reduce((s,e)=>s+leaveMonthly(e),0));

        party:e.id,memo:e.name+" — leave"}); });
      staff.forEach(e=>{ if(ticketMonthly(e)) L.push({account:"2127",dr:0,cr:ticketMonthly(e),
        party:e.id,memo:e.name+" — air ticket"}); });
